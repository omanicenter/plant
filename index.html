<style>
:root{--g:#1b7a43;--g2:#14532d;--gl:#e8f5ec;--gl2:#d7efe0;--muted:#64748b;--border:#e2e8f0;--bg:#eef3ef}
*{box-sizing:border-box;font-family:"Segoe UI",Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#0f172a}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;width:100%;background:#fff;color:#0f172a}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gl2);border-color:var(--g)}
textarea{resize:vertical}
label{font-size:13px;font-weight:700;display:block;margin-bottom:6px;color:#1e293b}
.hidden{display:none!important}
a{color:var(--g)}
#authScreen{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff 55%,var(--g2) 55%)}
.auth-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 22px}
.logo{width:92px;height:92px;border-radius:50%;background:var(--gl);border:3px solid var(--g);display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:12px}
.auth-top h1{font-size:21px;color:var(--g2);margin:0 0 4px}
.auth-top p{color:var(--muted);font-size:12.5px;margin:0 0 22px}
.auth-card{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:380px;box-shadow:0 6px 24px rgba(0,0,0,.07)}
.auth-card .field{margin-bottom:12px}
.auth-links{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px}
.auth-hero{height:30vh;background:linear-gradient(160deg,#166534,#22c55e);position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.auth-hero .plant{font-size:100px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.3));margin-bottom:26px}
.status-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.status-card{background:#fff;border-radius:18px;padding:34px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.status-card .ico{font-size:52px;margin-bottom:12px}
#appScreen{min-height:100vh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:#fff;box-shadow:0 0 30px rgba(0,0,0,.06)}
.topbar{position:sticky;top:0;z-index:40;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:13px 16px}
.topbar b{font-size:16px}
.topbar button{background:none;border:none;color:#fff;font-size:20px;padding:2px 6px}
main{flex:1;padding:16px;padding-bottom:96px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.page-head h1{font-size:19px;margin:0}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hello .av{width:52px;height:52px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:26px}
.hello b{font-size:16px}.hello span{font-size:12px;color:var(--muted);display:block}
.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--gl);border-radius:16px;padding:20px 12px;text-align:center;border:1px solid var(--gl2)}
.tile:active{transform:scale(.97)}
.tile .ico{font-size:30px;margin-bottom:8px}
.tile b{font-size:13.5px;color:#14532d}
.tile small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.btn{background:var(--g);color:#fff;border:none;padding:12px 18px;border-radius:12px;font-size:14.5px;font-weight:700}
.btn:active{filter:brightness(.92)}
.btn.outline{background:#fff;color:#334155;border:1px solid var(--border)}
.btn.danger{background:#dc2626}
.btn.gray{background:#e2e8f0;color:#334155}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.55}
.btnrow{display:flex;gap:10px}.btnrow .btn{flex:1}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid var(--border);margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15.5px;color:var(--g2)}
.stat{background:#fff;border-radius:14px;padding:13px;border:1px solid var(--border)}
.stat .n{font-size:23px;font-weight:800;margin-top:4px;color:var(--g2)}
.stat .t{font-size:11.5px;color:var(--muted)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:640px){.grid5{grid-template-columns:repeat(2,1fr)}}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-received{background:#dbeafe;color:#1e40af}.b-visual{background:#fef3c7;color:#92400e}
.b-micro{background:#d1fae5;color:#065f46}.b-pending_approval{background:#ede9fe;color:#5b21b6}
.b-approved{background:#ccfbf1;color:#115e59}.b-sent{background:#e2e8f0;color:#334155}
.b-suspended{background:#fee2e2;color:#b91c1c}.b-pending{background:#fef3c7;color:#92400e}
.b-replied{background:#d1fae5;color:#065f46}.b-waiting{background:#fef3c7;color:#92400e}
.mono{font-family:Consolas,monospace;font-weight:700;color:var(--g2)}
.sample-item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;background:#fff}
.sample-item img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex-shrink:0}
.sample-item .info{flex:1;min-width:0;font-size:12.5px;color:var(--muted);line-height:1.8}
.sample-item .info b{color:#0f172a;font-size:13.5px}
.stepsbar{display:flex;gap:6px;margin-bottom:16px}
.stepsbar div{flex:1;text-align:center;font-size:11px;color:var(--muted);padding-top:8px;position:relative}
.stepsbar div::before{content:attr(data-n);display:block;width:26px;height:26px;border-radius:50%;background:#e2e8f0;color:#64748b;margin:0 auto 4px;line-height:26px;font-weight:700}
.stepsbar div.on{color:var(--g2);font-weight:700}
.stepsbar div.on::before{background:var(--g);color:#fff}
.stepsbar div.done::before{background:var(--gl2);color:var(--g2)}
.stages{display:flex;justify-content:space-between;margin:2px 0 4px;padding:12px 2px 0;overflow:visible}
.stg{flex:1;text-align:center;position:relative;font-size:9.5px;min-width:0;color:#475569}
.stg::before{content:"";display:block;width:18px;height:18px;border-radius:50%;margin:0 auto 5px;background:#e2e8f0;border:2px solid #fff;box-shadow:0 0 0 2px #e2e8f0;z-index:1;position:relative}
.stg.done{color:#1e293b;font-weight:700}
.stg.done::before{background:var(--sc,var(--g));box-shadow:0 0 0 2px var(--sc,var(--g))}
.stg .bar{position:absolute;top:12px;left:50%;width:100%;height:3px;background:#e2e8f0}
.stg.done .bar{background:var(--sc,var(--g))}
.stg:first-child .bar{display:none}
.imgbox img{max-height:220px;max-width:100%;border-radius:12px;border:1px solid var(--border)}
.img-drop{border:2px dashed #a7c8b4;border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px;display:block;background:var(--gl)}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:24px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .bar-v{background:var(--g);width:70%;border-radius:6px 6px 0 0;min-height:3px;position:relative}
.chart .bar-v span{position:absolute;top:-20px;right:50%;transform:translateX(50%);font-size:12px;font-weight:700}
.chart .lbl{font-size:10px;color:var(--muted);text-align:center}
.alert{padding:12px 14px;border-radius:12px;font-size:13px;margin-bottom:12px}
.alert.purple{background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe}
.alert.red{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.alert.green{background:var(--gl);color:var(--g2);border:1px solid var(--gl2)}
#toast{position:fixed;bottom:100px;right:50%;transform:translateX(50%);background:#0f172a;color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.log-item{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--border)}
.log-item .dot{width:9px;height:9px;border-radius:50%;background:var(--g);margin-top:5px;flex-shrink:0}
.log-item small{color:var(--muted);display:block}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal-card{background:#fff;border-radius:16px;padding:20px;max-width:440px;width:100%;max-height:85vh;overflow:auto}
.modal-card h3{margin:0 0 12px;font-size:16px}
.modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.bottomnav{position:fixed;bottom:0;right:50%;transform:translateX(50%);width:100%;max-width:520px;z-index:50;background:#fff;border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;font-size:10.5px;color:var(--muted);padding:6px 2px;border-radius:10px;position:relative}
.bottomnav button .ico{font-size:21px}
.bottomnav button.active{color:var(--g2);font-weight:700}
.bottomnav .b-dot{position:absolute;top:0;left:20%;background:#7c3aed;color:#fff;font-size:10px;border-radius:99px;padding:1px 6px}
.sidenav{display:none}


/* ===== تخطيط الكمبيوتر: شاشة كاملة + قائمة جانبية يمين ===== */
@media(min-width:900px){
  body{background:#f8fafc}
  #appScreen{max-width:none;min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto 1fr;background:#f8fafc;box-shadow:none}
  .topbar{grid-column:1/3;grid-row:1;padding:15px 26px}
  .bottomnav{display:none}
  .sidenav{display:flex;flex-direction:column;grid-column:1;grid-row:2;background:#fff;border-left:1px solid var(--border);padding:20px 12px;gap:3px;align-items:stretch}
  .sidenav h3{color:var(--g2);margin:0 6px 14px;font-size:16px;display:flex;align-items:center;gap:8px}
  .sidenav button.mi{display:flex;align-items:center;gap:11px;width:100%;padding:12px 14px;border:none;background:none;border-radius:12px;font-size:14px;text-align:right;color:#1e293b}
  .sidenav button.mi:hover{background:#f1f5f9}
  .sidenav button.mi:active{background:var(--gl2)}
  .sidenav button.mi.active{background:var(--gl);color:var(--g2);font-weight:700}
  .sidenav .b-dot{position:static;margin-right:auto}
  main{grid-column:2;grid-row:2;padding:26px 32px 40px;max-width:1080px;width:100%;margin:0 auto}
  .homegrid{grid-template-columns:repeat(3,1fr)}
  .grid5{grid-template-columns:repeat(5,1fr)}
  .card{margin-bottom:16px}
  #toast{bottom:28px}
  #drawer .panel{width:320px}
}
#drawer{position:fixed;inset:0;z-index:70}
#drawer .back{position:absolute;inset:0;background:rgba(15,23,42,.4)}
#drawer .panel{position:absolute;top:0;bottom:0;right:0;width:270px;background:#fff;padding:20px 14px;overflow:auto;box-shadow:-4px 0 20px rgba(0,0,0,.15)}
#drawer .panel h3{color:var(--g2);margin:0 0 14px}
#drawer button.mi{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:none;background:none;border-radius:12px;font-size:14px;text-align:right;color:#1e293b}
#reportPage{background:#f1f5f9;padding:26px 0;min-height:100vh}
.sheet{background:#fff;max-width:820px;margin:0 auto;padding:40px 44px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.sheet table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:16px}
.sheet th,.sheet td{border:1px solid #94a3b8;padding:8px 10px;text-align:center}
.sheet .head td{font-weight:700;background:#f8fafc}
.sheet h2{font-size:16px;text-decoration:underline;margin:18px 0 8px}
.sheet ul{line-height:2}
.report-toolbar{max-width:820px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px}
@media(max-width:640px){.sheet{padding:20px 14px}.sheet table{font-size:11.5px}}
@media print{body{background:#fff}.no-print{display:none!important}.sheet{box-shadow:none;max-width:100%;padding:0}}
</style>

function fileToDataUrl(file,maxSize=900,quality=0.7){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      let w=img.width,h=img.height;const sc=Math.min(1,maxSize/Math.max(w,h));
      const c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",quality));
    };img.onerror=rej;img.src=r.result;};
    r.onerror=rej;r.readAsDataURL(file);
  });
}

async function wizGo(view){
  W.view=view;
  if(view==="visual"||view==="micro"){
    $("main").innerHTML="جارٍ التحميل...";
    try{
      const snap=await db.collection("samples").orderBy("createdAtSec","desc").get();
      const allowed=view==="visual"?["received","visual"]:["received","visual","micro"];
      W.pickList=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>allowed.includes(x.stage));
      if(W.sampleNo){const pre=W.pickList.find(p=>p.sampleNo===W.sampleNo);if(pre&&!W.id)await wizLoad(pre.id);}
    }catch(e){toast("خطأ في تحميل العينات: "+e.message);}
  }
  drawWizard();
}

async function wizPick(sel){
  const id=sel.value;
  if(!id){W.id="";W.sampleNo="";drawWizard();return;}
  $("main").innerHTML="جارٍ التحميل...";
  await wizLoad(id);
  drawWizard();
}

async function wizLoad(id){
  const d=await db.collection("samples").doc(id).get();
  if(!d.exists)return toast("العينة غير موجودة");
  const s=d.data();
  Object.assign(W,{id:id,sampleNo:s.sampleNo||"",receivedAt:s.receivedAt||today(),crop:s.crop||"",location:s.location||s.source||"",examiner:s.examinerName||"",fieldNotes:s.fieldNotes||"",imageData:s.imageData||"",part:s.part||"",symptom:s.symptom||"",visualNotes:s.visualNotes||"",microNotes:s.microNotes||"",resultDays:s.resultDays||"",pathogen:s.pathogen||"",microImage:s.microImage||"",pickedStage:s.stage||"received"});
}

async function wizImg(inp){
  const f=inp.files[0];if(!f)return;
  W.imageData=await fileToDataUrl(f);
  $("w_imgArea").innerHTML=`<div class="imgbox"><img src="${W.imageData}"></div><label class="img-drop" style="margin-top:8px">🔄 تغيير الصورة<input type="file" accept="image/*" class="hidden" onchange="wizImg(this)"></label>`;
}
async function wizMicroImg(inp){
  const f=inp.files[0];if(!f)return;
  W.microImage=await fileToDataUrl(f);
  $("w_microArea").innerHTML=`<div class="imgbox"><img src="${W.microImage}"></div><label class="img-drop" style="margin-top:8px">🔄 تغيير الصورة<input type="file" accept="image/*" class="hidden" onchange="wizMicroImg(this)"></label>`;
}

async function wizSaveReceive(btn){
  W.sampleNo=$("w_no").value.trim();W.receivedAt=$("w_received").value;W.crop=$("w_crop").value.trim();W.location=$("w_loc").value.trim();W.fieldNotes=$("w_notes").value.trim();W.examiner=$("w_examiner").value.trim();
  if(!W.sampleNo)return toast("أدخل رقم العينة");
  if(!W.crop)return toast("أدخل نوع العينة");
  btn.disabled=true;
  try{
    if(!W.id){
      const dup=await db.collection("samples").where("sampleNo","==",W.sampleNo).limit(1).get();
      if(!dup.empty){W.id=dup.docs[0].id;}
    }
    if(W.id){
      await db.collection("samples").doc(W.id).update({sampleNo:W.sampleNo,receivedAt:W.receivedAt,crop:W.crop,location:W.location,source:W.location,fieldNotes:W.fieldNotes,imageData:W.imageData||"",examinerName:W.examiner||me.name,stage:"received"});
      await logStage(W.id,"received","تم تحديث بيانات استلام العينة");
      toast("تم حفظ الاستلام — العينة رقم "+W.sampleNo);
    }else{
      const ref=await db.collection("samples").add({
        sampleNo:W.sampleNo,receivedAt:W.receivedAt,crop:W.crop,location:W.location,source:W.location,fieldNotes:W.fieldNotes,
        imageData:W.imageData,examinerName:W.examiner||me.name,part:"",symptom:"",visualNotes:"",microNotes:"",resultDays:"",pathogen:"",microImage:"",
        sampleType:"",stage:"received",createdBy:me.name,createdAtSec:Date.now()
      });
      W.id=ref.id;
      await logStage(ref.id,"received","تم استلام العينة وتسجيلها");
      toast("تم استلام العينة رقم "+W.sampleNo+" ✓");
    }
    W.pickedStage="received";
  }catch(e){btn.disabled=false;return toast("خطأ: "+e.message);}
  drawWizard();
}

async function wizSaveVisual(btn){
  W.part=$("w_part").value.trim();W.symptom=$("w_sym").value;W.visualNotes=$("w_vnotes").value.trim();
  if(!W.id)return toast("اختر العينة أولاً");

}

async function saveReport(sampleId,reportId){
  const recommendations=$("r_rec").value.trim();
  if(!recommendations)return toast("اكتب التوصيات");
  const reportNo=($("r_no")?$("r_no").value:"").trim();
  if(!reportNo)return toast("أدخل رقم التقرير");
  const d=await db.collection("samples").doc(sampleId).get();const s=d.data();
  const diagnosis=`بعد فحص عينة ${s.crop||""} (${s.part||""}) ظاهرياً ومجهرياً أظهرت النتائج ما يلي:\nالأعراض: ${s.symptom||"—"}${s.fieldNotes?" — "+s.fieldNotes:""}\nالفحص المجهري: ${s.microNotes||"—"}${s.resultDays?" (مدة ظهور النتيجة: "+s.resultDays+")":""}\nالسبب المرضي: ${s.pathogen||"—"}`;
  const data={sampleId,reportNo,diagnosis,recommendations,status:"pending",reviewerNote:"",reportDate:today(),createdBy:me.name};
  if(reportId){await db.collection("reports").doc(reportId).update(data);}
  else{await db.collection("reports").add(data);}
  await db.collection("samples").doc(sampleId).update({stage:"pending_approval"});
  await logStage(sampleId,"pending_approval","تم إرسال التقرير الفني لموافقة المدير");
  toast("تم إرسال التقرير لموافقة المدير");openSample(sampleId);
}
async function nextNoReport(){
  const ref=db.collection("counters").doc("report");
  const year=new Date().getFullYear();
  const n=await db.runTransaction(async t=>{const d=await t.get(ref);const v=(d.exists?d.data().value:0)+1;t.set(ref,{value:v});return v;});
  return `ت-${year}-${String(n).padStart(3,"0")}`;
}

async function saveEditedSample(id){

    sampleNo:$("ed_no").value.trim(),receivedAt:$("ed_received").value,crop:$("ed_crop").value.trim(),
    location:$("ed_loc").value.trim(),source:$("ed_loc").value.trim(),examinerName:$("ed_examiner").value.trim(),
    fieldNotes:$("ed_notes").value.trim(),part:$("ed_part").value.trim(),sampleType:$("ed_part").value.trim(),
    symptom:$("ed_sym").value,visualNotes:$("ed_vnotes").value.trim(),
    microNotes:$("ed_micro").value.trim(),resultDays:$("ed_days").value,pathogen:$("ed_path").value
  };
  if(!data.sampleNo)return toast("أدخل رقم العينة");

function deleteSampleModal(id,no){
  openModal(`<h3>🗑️ حذف العينة</h3>

async function confirmDeleteSample(id){

/* ===== العينات المحولة للمديرية ===== */
async function renderTransferred(){
  $("main").innerHTML=`
    <div class="page-head"><h1>العينات المحولة للمديرية</h1>
      <button class="btn sm" onclick="transferForm()">➕ إضافة</button></div>
    <input id="tq" placeholder="🔍 بحث عن رقم العينة..." style="margin-bottom:12px" oninput="loadTransfers()">
    <div id="trows">جارٍ التحميل...</div>`;
  loadTransfers();
}
async function loadTransfers(){
  const q=($("tq").value||"").trim();
  const snap=await db.collection("transfers").get();
  let rows=snap.docs.map(d=>({id:d.id,...d.data()}));
  if(q)rows=rows.filter(r=>(r.sampleNo||"").includes(q));
  rows.sort((a,b)=>(b.createdAtSec||0)-(a.createdAtSec||0));
  $("trows").innerHTML=rows.map(t=>`
    <div class="card" style="cursor:pointer" onclick="transferForm('${t.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span class="mono" style="font-size:15px">${esc(t.sampleNo)}</span>
        <span class="badge ${t.replyDate?"b-replied":"b-waiting"}">${t.replyDate?"تم الرد":"قيد الانتظار"}</span>
      </div>
      <div style="font-size:12.5px;color:var(--muted);line-height:1.9">
        تاريخ التحويل: ${esc(t.transferDate)}<br>
        المديرية: ${esc(t.directorate)}<br>
        تاريخ الرد: ${esc(t.replyDate||"—")}
        ${t.pdfName?`<br>📎 ${esc(t.pdfName)}`:''}
      </div>
    </div>`).join("")||'<div class="card" style="text-align:center;color:var(--muted);padding:34px">لا توجد عينات محولة</div>';
}
function transferForm(tid){
  openModal(`
    <h3>${tid?"تعديل عينة محولة":"إضافة عينة محولة"}</h3>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div><label>رقم العينة</label><input id="t_no" placeholder="ع-2025-001"></div>
      <div><label>تاريخ التحويل</label><input type="date" id="t_date" value="${today()}"></div>
      <div><label>المديرية</label><select id="t_dir"><option value="">اختر...</option>${opts("directorates")}</select></div>
      <div><label>تاريخ الرد</label><input type="date" id="t_reply"></div>
      <div><label>إرفاق ملف تقرير العينة (PDF)</label>
        <input type="file" id="t_pdf" accept="application/pdf">
        <div id="t_pdfName" style="font-size:12px;color:var(--muted);margin-top:4px"></div></div>
    </div>
    <div class="modal-actions">
      <button class="btn outline sm" onclick="closeModal()">إلغاء</button>
      <button class="btn sm" onclick="saveTransfer('${tid||""}')">حفظ</button>
    </div>`);
  $("t_pdf").onchange=()=>{$("t_pdfName").textContent=$("t_pdf").files[0]?$("t_pdf").files[0].name:"";};
  if(tid){db.collection("transfers").doc(tid).get().then(d=>{const t=d.data();
    $("t_no").value=t.sampleNo;$("t_date").value=t.transferDate;$("t_dir").value=t.directorate;$("t_reply").value=t.replyDate||"";
    if(t.pdfName)$("t_pdfName").textContent="📎 "+t.pdfName;});}
}
async function saveTransfer(tid){
  const no=$("t_no").value.trim(),date=$("t_date").value,dir=$("t_dir").value,reply=$("t_reply").value;
  if(!no||!date||!dir)return toast("أكمل رقم العينة والتاريخ والمديرية");
  let pdfData="",pdfName="";
  const f=$("t_pdf").files[0];
  if(f){
    if(f.size>700*1024)return toast("حجم ملف PDF كبير — الحد 700KB تقريباً");
    pdfData=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});
    pdfName=f.name;
  }
  const data={sampleNo:no,transferDate:date,directorate:dir,replyDate:reply||"",createdBy:me.name};
  if(pdfData){data.pdfData=pdfData;data.pdfName=pdfName;}
  if(tid){await db.collection("transfers").doc(tid).update(data);}
  else{data.createdAtSec=Date.now();await db.collection("transfers").add(data);}
  closeModal();toast("تم الحفظ");loadTransfers();
}

      <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">${esc(s.crop||"")} • ${esc(s.location||s.source||"")} • الفاحص: ${esc(r.createdBy||"—")}</div>
      <div style="background:#f8fafc;border-radius:12px;padding:13px;font-size:13px">
        <b>التشخيص:</b><p style="white-space:pre-line;margin:6px 0 10px">${esc(r.diagnosis)}</p>
        <b>التوصيات:</b><ul style="margin:6px 0;line-height:1.9">${r.recommendations.split("\n").filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      </div>
      <div class="btnrow" style="margin-top:12px">

        <button class="btn danger sm" onclick="rejectModal('${r.id}','${r.sampleId}')">↩️ إعادة</button>

}
async function approveReport(rid,sid){
  if(!canApprove())return toast("لا تملك صلاحية — الموافقة للمدير فقط");
  await db.collection("reports").doc(rid).update({status:"approved",approvedBy:me.name,approvedAt:today()});
  await db.collection("samples").doc(sid).update({stage:"approved"});
  await logStage(sid,"approved","وافق "+ROLES[me.role]+" على التقرير الفني");

function rejectModal(rid,sid){

async function confirmReject(rid,sid){

      ${u.id===me.uid?"":`
      <div style="margin-bottom:8px"><label>الصلاحية</label>
        <select onchange="setRole('${u.id}',this.value)">
          ${["pending","user","approver","admin"].map(r=>`<option value="${r}" ${u.role===r?"selected":""}>${ROLES[r]}</option>`).join("")}
        </select></div>
      <div style="margin-bottom:10px"><label>الصفحات المسموحة</label>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${Object.entries(PAGES).map(([k,v])=>`<label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:400;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:6px 9px">
            <input type="checkbox" style="width:auto" ${((u.pages&&u.pages.length?u.pages:(u.role==="approver"?["dashboard","samples","new","transferred","approvals"]:["dashboard","samples","new","transferred"]))).includes(k)?"checked":""} onchange="togglePage('${u.id}','${k}',this.checked,'${esc((u.pages||[]).join(","))}')"> ${v}</label>`).join("")}
        </div></div>
      <div class="btnrow">
        <button class="btn outline sm" onclick="resetPass('${esc(u.email||"")}')">🔑 إعادة كلمة المرور</button>

async function setRole(uid,role){await db.collection("users").doc(uid).update({role,status:"active"});toast("تم تحديث الصلاحية");renderStaff();}
async function togglePage(uid,page,checked,current){
  let pages=current?current.split(",").filter(Boolean):[];
  if(checked&&!pages.includes(page))pages.push(page);
  if(!checked)pages=pages.filter(p=>p!==page);
  await db.collection("users").doc(uid).update({pages});
  toast("تم تحديث الصفحات المسموحة");
}
async function resetPass(email){
  if(!email)return toast("لا يوجد بريد لهذا الحساب");
  try{await auth.sendPasswordResetEmail(email);toast("أُرسل رابط إعادة التعيين إلى "+email);}catch(e){toast("خطأ: "+e.message);}
}
function suspendModal(uid,name){

      <div class="card"><h3>${LIST_NAMES[k]}</h3>

async function addListItem(k){
  const v=$("add_"+k).value.trim();
  if(!v)return;
  if(LISTS[k].includes(v))return toast("العنصر موجود مسبقاً");
  LISTS[k].push(v);
  await db.collection("settings").doc("lists").set(LISTS);
  toast("تمت الإضافة");renderSettings();
}
async function delListItem(k,i){
  LISTS[k].splice(i,1);
  await db.collection("settings").doc("lists").set(LISTS);
  toast("تم الحذف");renderSettings();
}

    FUNGI=snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){FUNGI=[];}
  drawFungi("");
}
function drawFungi(q){
  const query=(q||"").trim();
  const list=query?FUNGI.filter(f=>(f.name||"").includes(query)):FUNGI;
  $("main").innerHTML=`
    <div class="page-head">
      <h1>🍄 المرجع العلمي للفطريات</h1>
      <button class="btn sm" onclick="fungusForm()">➕ إضافة فطر</button>
    </div>
    <div class="card" style="padding:12px 14px"><div class="field" style="margin:0">
      <input id="f_search" placeholder="🔍 اكتب اسم الفطر — تظهر النتائج فوراً..." value="${esc(q)}" oninput="drawFungi(this.value)">
    </div></div>
    <p style="font-size:12px;color:var(--muted);margin:-4px 2px 12px">${query?`النتائج المطابقة: <b>${list.length}</b>`:`إجمالي الأنواع المسجلة: <b>${FUNGI.length}</b>`}</p>
    ${list.length?`<div class="homegrid" style="grid-template-columns:repeat(2,1fr)">${list.map(f=>`
      <div class="tile" style="padding:12px 8px" onclick="openFungus('${f.id}')">
        ${f.image?`<img src="${f.image}" style="width:100%;height:110px;object-fit:cover;border-radius:12px;margin-bottom:8px">`:`<div style="padding:14px 0 6px"><img src="${MICRO_ICON}" style="width:56px;height:56px"></div>`}
        <b style="font-size:12.5px;display:block">${esc(f.name)}</b>
      </div>`).join("")}</div>`:`<div class="card" style="text-align:center;color:var(--muted);padding:26px">${query?`لا توجد نتائج مطابقة لـ «${esc(query)}»`:"لا توجد فطريات مسجلة بعد — اضغط ➕ لإضافة أول فطر"}</div>`}`;
  const si=$("f_search");
  if(document.activeElement!==si){si.focus();si.setSelectionRange(si.value.length,si.value.length);}
}

function openFungus(id){
  const f=FUNGI.find(x=>x.id===id);if(!f)return;
  $("main").innerHTML=`
    <div class="page-head">
      <h1 style="font-size:16px">🍄 ${esc(f.name)}</h1>
      <button class="btn outline sm" onclick="renderFungi()">→ رجوع للقائمة</button>
    </div>
    <div class="card" style="text-align:center;padding:18px">
      ${f.image?`<img src="${f.image}" style="width:100%;max-height:420px;object-fit:contain;border-radius:14px">`:`<div style="padding:34px 0"><img src="${MICRO_ICON}" style="width:130px;height:130px"></div>`}
    </div>
    <div class="card">
      <h3 style="margin:0 0 8px;color:#7c2d12">🍄 ${esc(f.name)}</h3>
      <div style="font-size:14px;color:#334155;line-height:2;white-space:pre-line"><b>التوصيف العلمي:</b><br>${esc(f.desc)}</div>
      ${f.updatedBy?`<div style="font-size:11px;color:var(--muted);margin-top:12px">آخر تحديث: ${esc(f.updatedBy)}</div>`:""}
    </div>
    <div class="btnrow">
      <button class="btn outline" onclick="fungusForm('${f.id}')">✏️ تعديل</button>
      <button class="btn danger" onclick="deleteFungus('${f.id}')">🗑️ حذف</button>
    </div>`;
  window.scrollTo(0,0);
}

let F_EDIT="",F_IMG="";
function fungusForm(id){
  F_EDIT=id||"";F_IMG="";
  const f=F_EDIT?FUNGI.find(x=>x.id===F_EDIT):{name:"",desc:"",image:""};
  openModal(`
    <h3>${F_EDIT?"✏️ تعديل فطر":"➕ إضافة فطر جديد"}</h3>
    <div style="display:flex;flex-direction:column;gap:11px">
      <div><label>اسم الفطر</label><input id="f_name" value="${esc(f.name)}" placeholder="مثال: الفيوزاريوم wilt"></div>
      <div><label>التوصيف العلمي</label><textarea id="f_desc" rows="4" placeholder="الشكل، اللون، الأبواغ، بيئة النمو...">${esc(f.desc)}</textarea></div>
      <div><label>صورة الفطر</label>
        <div id="f_imgArea">${f.image?`<div class="imgbox"><img src="${f.image}"></div><label class="img-drop" style="margin-top:8px">🔄 تغيير الصورة<input type="file" accept="image/*" class="hidden" onchange="fungusImg(this)"></label>`:`<label class="img-drop">🍄 اختر صورة<input type="file" accept="image/*" class="hidden" onchange="fungusImg(this)"></label>`}</div>
      </div>
      <button class="btn" onclick="saveFungus()">💾 حفظ</button>
    </div>`);
}
async function fungusImg(inp){
  const file=inp.files[0];if(!file)return;
  F_IMG=await fileToDataUrl(file);
  $("f_imgArea").innerHTML=`<div class="imgbox"><img src="${F_IMG}"></div><label class="img-drop" style="margin-top:8px">🔄 تغيير الصورة<input type="file" accept="image/*" class="hidden" onchange="fungusImg(this)"></label>`;
}
async function saveFungus(){
  const name=$("f_name").value.trim(),desc=$("f_desc").value.trim();
  if(!name)return toast("أدخل اسم الفطر");
  if(!desc)return toast("أدخل التوصيف العلمي");
  const old=F_EDIT?FUNGI.find(x=>x.id===F_EDIT):null;
  const image=F_IMG||(old?old.image:"");
  if(!image)return toast("أرفق صورة الفطر");
  const data={name,desc,image,updatedBy:me.name,updatedAt:Date.now()};
  try{
    if(F_EDIT){await db.collection("fungi").doc(F_EDIT).update(data);}
    else{data.createdBy=me.name;data.createdAt=Date.now();await db.collection("fungi").add(data);}
  }catch(e){return toast("خطأ: "+e.message);}
  closeModal();toast("تم حفظ الفطر ✓");renderFungi();
}
function deleteFungus(id){
  const f=FUNGI.find(x=>x.id===id);if(!f)return;
  openModal(`
    <div style="text-align:center">
      <div style="font-size:42px;margin-bottom:6px">🗑️</div>
      <h3 style="margin:0 0 6px">حذف الفطر</h3>
      <p style="color:var(--muted);font-size:14px;margin:0 0 18px">هل أنت متأكد من حذف <b style="color:#b91c1c">${esc(f.name)}</b> من المرجع؟</p>
      <div class="btnrow">
        <button class="btn gray" onclick="closeModal()">تراجع</button>
        <button class="btn danger" onclick="closeModal();doDeleteFungus('${id}')">نعم، حذف</button>
      </div>
    </div>`);
}
async function doDeleteFungus(id){
  try{await db.collection("fungi").doc(id).delete();}catch(e){return toast("خطأ: "+e.message);}
  toast("تم الحذف");renderFungi();
}

/* ===== التقرير للطباعة ===== */
/* محتوى التقرير الموحّد — نفس التنسيق للشاشة و Word */
function reportSheetHTML(r,s){
  const B='border:1px solid #94a3b8;padding:8px 10px;';
  const H=B+'font-weight:700;background:#f8fafc;';
  const T='width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:16px;';
  return `
  <div style="text-align:center;margin-bottom:18px"><img src="${LOGO_B64}" style="width:130px" alt="شعار الوزارة"></div>
  <table style="${T}">
    <tr>
      <td style="${H}width:33%">المديرية العامة<br>للبحوث الزراعية والحيوانية</td>
      <td style="${H}width:34%;font-size:18px">تقرير فني</td>
      <td style="${H}width:33%">مركز بحوث وقاية النبات<br><span style="font-weight:400">قسم بحوث أمراض النبات</span></td>
    </tr>
    <tr>
      <td style="${H}">التاريخ: <span style="font-weight:400">${esc(r.reportDate)}</span></td>
      <td colspan="2" style="${B}text-align:right"><b>مصدر العينة: </b>${esc(s.location||s.source||"—")} &nbsp; <b>رقم العينة: </b>${esc(s.sampleNo)}</td>
    </tr>
    <tr>
      <td style="${H}">رقم التقرير: <span style="font-weight:400">${esc(r.reportNo)}</span></td>
      <td colspan="2" style="${B}text-align:right"><b>فاحص العينة: </b>${esc(s.examinerName||r.createdBy||"—")} &nbsp; <b>نوع العينة: </b>${esc(s.crop||"—")}</td>
    </tr>
  </table>

  <h2 style="font-size:16px;text-decoration:underline;margin:18px 0 8px">1. التشخيص:</h2>
  <p style="white-space:pre-line;line-height:1.9">${esc(r.diagnosis)}</p>

  <table style="${T}">
    <tr><td style="${H}width:40px">م</td><td style="${H}">رقم العينة</td><td style="${H}">العينة</td><td style="${H}">الجزء المصاب</td><td style="${H}">الإصابة</td></tr>
    <tr><td style="${B}">1</td><td style="${B}">${esc(s.sampleNo)}</td><td style="${B}">${esc(s.crop||"—")}</td><td style="${B}">${esc(s.part||"—")}</td>
        <td style="${B}font-weight:700;color:#b91c1c">${esc(s.pathogen||s.symptom||"—")}</td></tr>
  </table>

  <h2 style="font-size:16px;text-decoration:underline;margin:18px 0 8px">2. التوصيات:</h2>
  <ul style="line-height:2">${r.recommendations.split("\n").filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>

  <div style="text-align:center;margin-top:44px;font-size:13px;color:#475569">..............قسم بحوث أمراض النبات..............</div>`;
}

async function openReport(rid){
  const d=await db.collection("reports").doc(rid).get();
  if(!d.exists)return toast("التقرير غير موجود");
  const r={id:d.id,...d.data()};
  const sd=await db.collection("samples").doc(r.sampleId).get();
  const s=sd.data();
  $("appScreen").classList.add("hidden");
  const rp=$("reportPage");rp.classList.remove("hidden");
  rp.innerHTML=`
    <div class="report-toolbar no-print">
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="window.print()">🖨️ PDF / طباعة</button>
        <button class="btn outline" onclick="downloadWord('${r.id}')">⬇️ Word</button>
      </div>
      <button class="btn outline" onclick="closeReport('${r.sampleId}')">→ رجوع</button>
    </div>
    <div class="sheet">${reportSheetHTML(r,s)}</div>`;
}

/* تصدير التقرير كملف Word بنفس التنسيق تماماً */
async function downloadWord(rid){
  const d=await db.collection("reports").doc(rid).get();
  if(!d.exists)return toast("التقرير غير موجود");
  const r={id:d.id,...d.data()};
  const sd=await db.collection("samples").doc(r.sampleId).get();
  const s=sd.data();
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" dir="rtl" lang="ar"><head><meta charset="utf-8"><title>تقرير ${esc(r.reportNo)}</title><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]--><style>@page{size:A4;margin:2cm}body{font-family:"Traditional Arabic",Arial,sans-serif;font-size:14px;direction:rtl;color:#0f172a}table{page-break-inside:auto}tr{page-break-inside:avoid}</style></head><body>${reportSheetHTML(r,s)}</body></html>`;
  const blob=new Blob(["\ufeff"+html],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="تقرير-"+(r.reportNo||rid)+".doc";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("تم تصدير ملف Word ✓");
}
function closeReport(sid){
  $("reportPage").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  openSample(sid);
}
</script>
