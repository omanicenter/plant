<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام فحص عينات النباتات</title>
<style>
:root{--green:#047857;--green-d:#065f46;--muted:#64748b;--border:#e2e8f0;--bg:#f1f5f9}
*{box-sizing:border-box;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
body{margin:0;background:var(--bg);color:#0f172a}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;width:100%;background:#fff}
textarea{resize:vertical}
label{font-size:13px;font-weight:600;display:block;margin-bottom:5px}
.hidden{display:none!important}
a{color:var(--green-d)}
/* تسجيل الدخول */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:#fff;border-radius:16px;padding:32px;max-width:400px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.auth-card h1{font-size:20px;text-align:center;color:var(--green-d);margin:0 0 6px}
.auth-card p.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px}
.auth-card .field{margin-bottom:14px}
.auth-links{display:flex;justify-content:space-between;margin-top:12px;font-size:13px}
/* شاشات الحالة */
.status-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.status-card{background:#fff;border-radius:16px;padding:36px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.status-card .ico{font-size:52px;margin-bottom:12px}
/* الهيكل */
#appScreen{display:flex;min-height:100vh}
aside{width:230px;background:#fff;border-inline-start:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column}
aside h2{font-size:15px;color:var(--green-d);margin:0 8px 18px;display:flex;align-items:center;gap:8px}
nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:none;background:none;border-radius:10px;font-size:14px;margin-bottom:4px;color:#334155;text-align:right}
nav button:hover{background:#f1f5f9}
nav button.active{background:#ecfdf5;color:var(--green-d);font-weight:700}
.userbox{margin-top:auto;padding:12px;border-top:1px solid var(--border);font-size:13px}
.userbox .role{color:var(--muted);font-size:12px}
main{flex:1;padding:26px;max-width:1100px;margin:0 auto;width:100%;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.page-head h1{font-size:22px;margin:0}
.btn{background:var(--green);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600}
.btn:hover{background:var(--green-d)}
.btn.outline{background:#fff;color:#0f172a;border:1px solid var(--border)}
.btn.danger{background:#dc2626}
.btn.teal{background:#0f766e}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:18px}
.card h3{margin:0 0 14px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:900px){.grid2,.grid5{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat .n{font-size:26px;font-weight:800;margin-top:6px}
.stat .t{font-size:12px;color:var(--muted)}
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th,table.list td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--border)}
table.list th{color:var(--muted);font-size:12px;background:#f8fafc}
table.list tbody tr:hover{background:#f8fafc}
table.list tbody tr.clickable{cursor:pointer}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-received{background:#dbeafe;color:#1e40af}.b-in_progress{background:#fef3c7;color:#92400e}
.b-completed{background:#d1fae5;color:#065f46}.b-pending_approval{background:#ede9fe;color:#5b21b6}
.b-approved{background:#ccfbf1;color:#115e59}.b-sent{background:#e2e8f0;color:#334155}
.b-suspended{background:#fee2e2;color:#b91c1c}.b-pending{background:#fef3c7;color:#92400e}
.mono{font-family:Consolas,monospace;font-weight:700;color:var(--green-d)}
/* خط المراحل */
.stages{display:flex;justify-content:space-between;margin:6px 0;overflow:hidden}
.stg{flex:1;text-align:center;position:relative;font-size:11.5px;min-width:0}
.stg::before{content:"";display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 5px;background:#e2e8f0;border:2px solid #fff;box-shadow:0 0 0 2px #e2e8f0;z-index:1;position:relative}
.stg.done::before{background:var(--green);box-shadow:0 0 0 2px var(--green)}
.stg .d{font-size:10px;color:var(--muted)}
.stg .bar{position:absolute;top:13px;right:50%;width:100%;height:3px;background:#e2e8f0}
.stg.done .bar{background:var(--green)}
.stg:first-child .bar{display:none}
/* صورة */
.imgbox img{max-height:220px;max-width:100%;border-radius:10px;border:1px solid var(--border)}
.img-drop{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px;display:block}
.img-drop:hover{background:#f8fafc}
/* رسم شهري */
.chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:24px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .bar-v{background:var(--green);width:70%;border-radius:6px 6px 0 0;min-height:3px;position:relative}
.chart .bar-v span{position:absolute;top:-20px;right:50%;transform:translateX(50%);font-size:12px;font-weight:700}
.chart .lbl{font-size:10.5px;color:var(--muted);text-align:center}
/* تنبيهات */
.alert{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
.alert.purple{background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe}
.alert.red{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
#toast{position:fixed;bottom:90px;right:50%;transform:translateX(50%);background:#0f172a;color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
/* سجل الحركة */
.log-item{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--border)}
.log-item .dot{width:9px;height:9px;border-radius:50%;background:var(--green);margin-top:5px;flex-shrink:0}
.log-item small{color:var(--muted);display:block}
/* نافذة منبثقة */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal-card{background:#fff;border-radius:14px;padding:22px;max-width:440px;width:100%}
.modal-card h3{margin:0 0 12px}
.modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
/* التقرير للطباعة */
#reportPage{background:#f1f5f9;padding:26px 0;min-height:100vh}
.sheet{background:#fff;max-width:820px;margin:0 auto;padding:44px 48px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.sheet table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:18px}
.sheet th,.sheet td{border:1px solid #94a3b8;padding:8px 10px;text-align:center}
.sheet .head td{font-weight:700;background:#f8fafc}
.sheet h2{font-size:16px;text-decoration:underline;margin:18px 0 8px}
.sheet ul{line-height:2}
.sheet .sig{display:flex;justify-content:space-between;margin-top:50px;font-size:13px}
.report-toolbar{max-width:820px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
/* الشريط العلوي للجوال */
#topBar{display:none}
#bottomNav{display:none}
@media(max-width:700px){
  aside{display:none}
  main{padding:14px;padding-top:70px;padding-bottom:90px;max-width:100%}
  .grid2,.grid5{grid-template-columns:1fr 1fr}
  .page-head h1{font-size:19px}
  .card{padding:14px}
  .stg{font-size:9.5px}
  .stg::before{width:16px;height:16px}
  .stg .bar{top:9px}
  .stg .d{display:none}
  .chart{height:150px}
  table.list{font-size:12px;min-width:620px}
  .sheet{padding:22px 16px}
  #topBar{display:flex;position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:10px 14px;align-items:center;justify-content:space-between}
  #topBar b{color:var(--green-d);font-size:15px}
  #topBar button{background:none;border:none;font-size:20px;padding:4px}
  #bottomNav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.06)}
  #bottomNav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;font-size:10.5px;color:var(--muted);padding:6px 2px;border-radius:10px;position:relative}
  #bottomNav button .ico{font-size:21px}
  #bottomNav button.active{color:var(--green-d);font-weight:700}
  #bottomNav .b-dot{position:absolute;top:0;left:20%;background:#7c3aed;color:#fff;font-size:10px;border-radius:99px;padding:1px 6px}
}
@media print{
  body{background:#fff}
  .no-print{display:none!important}
  .sheet{box-shadow:none;max-width:100%;padding:0}
}
</style>
</head>
<body>

<!-- ======== شاشة الدخول ======== -->
<div id="authScreen">
  <div class="auth-card">
    <h1>🌱 نظام فحص عينات النباتات</h1>
    <p class="sub">قسم بحوث أمراض النبات — مركز بحوث وقاية النبات</p>
    <div class="field hidden" id="nameField"><label>الاسم الكامل</label><input id="authName" type="text" placeholder="الاسم الكامل"></div>
    <div class="field"><label>البريد الإلكتروني</label><input id="authEmail" type="email" placeholder="name@example.com"></div>
    <div class="field"><label>كلمة المرور</label><input id="authPass" type="password" placeholder="••••••••"></div>
    <button class="btn" id="authMainBtn" style="width:100%" onclick="doLogin()">تسجيل الدخول</button>
    <div class="auth-links">
      <a href="#" onclick="toggleRegister();return false" id="regLink">إنشاء حساب جديد</a>
      <a href="#" onclick="forgotPass();return false">نسيت كلمة المرور؟</a>
    </div>
  </div>
</div>

<!-- ======== شاشة الحالة (انتظار / موقوف / تفعيل) ======== -->
<div id="statusScreen" class="hidden"></div>

<!-- ======== التطبيق ======== -->
<div id="appScreen" class="hidden">
  <div id="topBar" class="no-print">
    <b>🌱 فحص العينات</b>
    <div>
      <button onclick="openProfile()" title="حسابي">👤</button>
      <button onclick="doLogout()" title="تسجيل الخروج">🚪</button>
    </div>
  </div>
  <aside>
    <h2>🌱 <span>فحص العينات</span></h2>
    <nav id="sideNav">
      <button data-page="dashboard" onclick="showPage('dashboard')">📊 <span>لوحة المتابعة</span></button>
      <button data-page="samples" onclick="showPage('samples')">🧪 <span>سجل العينات</span></button>
      <button data-page="new" onclick="showPage('new')">➕ <span>تسجيل عينة</span></button>
      <button data-page="approvals" id="navApprovals" class="hidden" onclick="showPage('approvals')">✅ <span>موافقات التقارير</span> <b id="pendBadge" class="badge b-pending_approval hidden" style="margin-inline-start:auto"></b></button>
      <button data-page="staff" id="navStaff" class="hidden" onclick="showPage('staff')">👥 <span>الموظفون</span></button>
    </nav>
    <div class="userbox">
      <b id="userName"></b>
      <div class="role" id="userRole"></div>
      <button class="btn outline" style="width:100%;margin-top:10px;padding:7px" onclick="doLogout()">تسجيل الخروج</button>
    </div>
  </aside>
  <main id="main"></main>
  <nav id="bottomNav">
    <button data-page="dashboard" onclick="showPage('dashboard')"><span class="ico">📊</span>المتابعة</button>
    <button data-page="samples" onclick="showPage('samples')"><span class="ico">🧪</span>العينات</button>
    <button data-page="new" onclick="showPage('new')"><span class="ico">➕</span>تسجيل</button>
    <button data-page="approvals" id="navApprovalsM" class="hidden" onclick="showPage('approvals')"><span class="ico">✅</span>الموافقات<span id="pendBadgeM" class="b-dot hidden"></span></button>
    <button data-page="staff" id="navStaffM" class="hidden" onclick="showPage('staff')"><span class="ico">👥</span>الموظفون</button>
  </nav>
</div>

<div id="reportPage" class="hidden"></div>
<div id="modal" class="hidden no-print"></div>
<div id="toast" class="hidden"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ═══════ إعدادات Firebase ═══════ */
const firebaseConfig = {
  apiKey: "AIzaSyCiLxa2mg7JlT1Z_6OGbnnDGXAmMoPL5QI",
  authDomain: "bahla-plant-center.firebaseapp.com",
  projectId: "bahla-plant-center",
  storageBucket: "bahla-plant-center.firebasestorage.app",
  messagingSenderId: "916346827518",
  appId: "1:916346827518:web:7b45b514af5464e32aabaf"
};
/* ═══════════════════════════════ */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const STAGES = {received:"تم الاستلام",in_progress:"قيد الفحص",completed:"اكتمل الفحص",pending_approval:"بانتظار موافقة المسؤول",approved:"تمت الموافقة",sent:"أُرسل لصاحب العينة"};
const STAGE_ORDER = ["received","in_progress","completed","pending_approval","approved","sent"];
const REPORT_STATUS = {pending:"بانتظار الموافقة",approved:"معتمد",rejected:"معاد للمراجعة",sent:"مُرسل"};
const SAMPLE_TYPES = ["تربة وجذور","جذور","تربة","أوراق","أغصان","ثمار","بذور","شتلات","عينة كاملة","أخرى"];
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const ROLES = {admin:"المسؤول",approver:"المدير",user:"فاحص",pending:"بانتظار الموافقة"};

let me = null;
let isRegisterMode = false;
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add("hidden"),3200);}
function fmtDate(ts){if(!ts)return"";const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString("ar");}
const canApprove = () => me && (me.role==="admin"||me.role==="approver");

/* ---------- شاشات الحالة ---------- */
function showStatus(icon, title, body, extraBtn){
  $("authScreen").classList.add("hidden");
  $("appScreen").classList.add("hidden");
  $("statusScreen").classList.remove("hidden");
  $("statusScreen").innerHTML = `<div class="status-card">
    <div class="ico">${icon}</div><h2 style="margin:0 0 10px">${title}</h2>
    <p style="color:var(--muted);font-size:14px;line-height:1.9">${body}</p>
    ${extraBtn||""}
    <button class="btn outline" style="width:100%;margin-top:10px" onclick="doLogout()">تسجيل الخروج</button>
  </div>`;
}
function hideAll(){["authScreen","statusScreen","appScreen","reportPage"].forEach(i=>$(i).classList.add("hidden"));}

/* ---------- الدخول والتسجيل ---------- */
function toggleRegister(){
  isRegisterMode = !isRegisterMode;
  $("nameField").classList.toggle("hidden", !isRegisterMode);
  $("authMainBtn").textContent = isRegisterMode ? "إنشاء الحساب" : "تسجيل الدخول";
  $("authMainBtn").onclick = isRegisterMode ? doRegister : doLogin;
  $("regLink").textContent = isRegisterMode ? "لدي حساب — تسجيل الدخول" : "إنشاء حساب جديد";
}
async function doLogin(){
  try{
    const cred = await auth.signInWithEmailAndPassword($("authEmail").value.trim(), $("authPass").value);
    await cred.user.reload();
  }catch(e){
    const msgs={"auth/user-not-found":"لا يوجد حساب بهذا البريد","auth/wrong-password":"كلمة المرور غير صحيحة","auth/invalid-credential":"بيانات الدخول غير صحيحة","auth/invalid-email":"البريد غير صحيح","auth/too-many-requests":"محاولات كثيرة — حاول لاحقاً"};
    toast(msgs[e.code]||("خطأ: "+e.message));
  }
}
async function doRegister(){
  const name=$("authName").value.trim(), email=$("authEmail").value.trim(), pass=$("authPass").value;
  if(!name) return toast("اكتب اسمك الكامل");
  if(pass.length<6) return toast("كلمة المرور 6 أحرف على الأقل");
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    const admins = await db.collection("users").where("role","==","admin").limit(1).get();
    const isFirst = admins.empty;
    await db.collection("users").doc(cred.user.uid).set({
      name, email, role: isFirst?"admin":"pending", status:"active", suspendReason:"", createdAt: today()
    });
    await cred.user.sendEmailVerification();
    await auth.signOut();
    toggleRegister();
    hideAll(); $("authScreen").classList.remove("hidden");
    showStatus("📧","تحقق من بريدك الإلكتروني",
      "أرسلنا رابط تفعيل إلى <b>"+esc(email)+"</b>.<br>افتح الرابط ثم سجّل الدخول.<br>"+
      (isFirst?"<b>حسابك هو حساب المسؤول.</b>":"بعد التفعيل سيراجع المسؤول حسابك ويمنحك الصلاحيات."),
      `<button class="btn" style="width:100%" onclick="backToLogin()">الذهاب لتسجيل الدخول</button>`);
  }catch(e){
    const msgs={"auth/email-already-in-use":"البريد مستخدم مسبقاً — سجّل الدخول","auth/weak-password":"كلمة المرور ضعيفة","auth/invalid-email":"البريد غير صحيح"};
    toast(msgs[e.code]||("خطأ: "+e.message));
  }
}
function backToLogin(){hideAll();$("authScreen").classList.remove("hidden");}
async function forgotPass(){
  const email=$("authEmail").value.trim();
  if(!email) return toast("اكتب بريدك أولاً ثم اضغط «نسيت كلمة المرور»");
  try{ await auth.sendPasswordResetEmail(email); toast("أرسلنا رابط إعادة التعيين إلى بريدك"); }
  catch(e){ toast(e.code==="auth/user-not-found"?"لا يوجد حساب بهذا البريد":"خطأ: "+e.message); }
}
function doLogout(){auth.signOut();}

auth.onAuthStateChanged(async u=>{
  if(!u){ me=null; hideAll(); $("authScreen").classList.remove("hidden"); return; }
  await u.reload();
  if(!u.emailVerified){
    showStatus("📧","بريدك غير مفعّل",
      "فعّل حسابك من الرابط المرسل إلى <b>"+esc(u.email)+"</b> ثم سجّل الدخول.",
      `<button class="btn outline" style="width:100%" onclick="resendVerify()">إعادة إرسال رابط التفعيل</button>`);
    return;
  }
  const doc = await db.collection("users").doc(u.uid).get();
  if(!doc.exists){
    showStatus("🚫","الحساب محذوف","تم حذف حسابك من قبل الإدارة. راجع المسؤول.");
    return;
  }
  me = {uid:u.uid, ...doc.data()};
  [navApprovals,navApprovalsM,navStaff,navStaffM].forEach(e=>e.classList.add("hidden"));
  if(me.status==="suspended"){
    showStatus("⛔","حسابك موقوف","تم إيقاف حسابك من قبل الإدارة."+(me.suspendReason?`<br><b>السبب:</b> ${esc(me.suspendReason)}`:""));
    return;
  }
  if(me.role==="pending"){
    showStatus("⏳","حسابك في انتظار الموافقة من الإدارة",
      "تم تفعيل حسابك بنجاح.<br>سيقوم المسؤول بمراجعة حسابك ومنحك الصلاحيات المناسبة، بعدها تستطيع استخدام النظام.");
    return;
  }
  // دخول ناجح
  hideAll(); $("appScreen").classList.remove("hidden");
  userName.textContent = me.name;

<script>
/* ---------- أدوات عامة ---------- */
async function nextNo(name, prefix){
  const ref = db.collection("counters").doc(name);
  const year = new Date().getFullYear();
  const n = await db.runTransaction(async t=>{
    const d = await t.get(ref);
    const v = (d.exists? d.data().value:0)+1;
    t.set(ref,{value:v});
    return v;
  });
  return `${prefix}-${year}-${String(n).padStart(4,"0")}`;
}
async function logStage(sampleId, stage, note){
  await db.collection("samples").doc(sampleId).collection("logs").add({
    stage, note: note||"", by: me.name, at: firebase.firestore.FieldValue.serverTimestamp()
  });
}
function fileToDataUrl(file, maxSize=900, quality=0.7){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>{const img=new Image();img.onload=()=>{
      let w=img.width,h=img.height;const sc=Math.min(1,maxSize/Math.max(w,h));
      const c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",quality));
    };img.onerror=rej;img.src=r.result;};
    r.onerror=rej;r.readAsDataURL(file);
  });
}

async function saveExam(id){
  const patch = {
    examStartedAt: $("e_start").value, examinerName: $("e_examiner").value.trim(),
    infection: $("e_infection").value.trim(), result: $("e_result").value.trim(), notes: $("e_notes").value.trim()
  };
  const d = await db.collection("samples").doc(id).get();
  const cur = d.data().stage;
  if(patch.examStartedAt && cur==="received"){ patch.stage="in_progress"; }
  if(patch.result && ["received","in_progress"].includes(cur)){ patch.stage="completed"; }
  await db.collection("samples").doc(id).update(patch);
  if(patch.stage==="in_progress") await logStage(id,"in_progress","بدأ الفحص المخبري");
  if(patch.stage==="completed") await logStage(id,"completed","اكتمل الفحص وتم تسجيل النتيجة");
  toast("تم حفظ بيانات الفحص"); openSample(id);
}

async function saveReport(sampleId, reportId){
  const diagnosis=$("r_diag").value.trim(), recommendations=$("r_rec").value.trim();
  if(!diagnosis||!recommendations) return toast("أكمل التشخيص والتوصيات");
  const data = {sampleId, diagnosis, recommendations, status:"pending", reviewerNote:"", reportDate:today(), createdBy:me.name};
  if(reportId){
    await db.collection("reports").doc(reportId).update(data);
  } else {
    data.reportNo = await nextNo("report","ت");
    const ref = await db.collection("reports").add(data);
    reportId = ref.id;
  }
  await db.collection("samples").doc(sampleId).update({stage:"pending_approval"});
  await logStage(sampleId,"pending_approval","تم إرسال التقرير الفني لموافقة المدير");
  toast("تم إرسال التقرير لموافقة المدير"); openSample(sampleId);
}

async function markSent(reportId, sampleId){
  await db.collection("reports").doc(reportId).update({status:"sent"});
  await db.collection("samples").doc(sampleId).update({stage:"sent"});
  await logStage(sampleId,"sent","تم تسليم/إرسال التقرير لصاحب العينة");
  toast("تم التعليم كمُرسل"); openSample(sampleId);
}
</script>

  const snap = await db.collection("reports").where("status","==","pending").get();
  const items = [];
  for(const d of snap.docs){
    const r = {id:d.id,...d.data()};
    const sd = await db.collection("samples").doc(r.sampleId).get();
    items.push({r, s: sd.exists?sd.data():{}});
  }
  $("apprBody").innerHTML = items.map(({r,s})=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <div><span class="mono">${esc(r.reportNo)}</span> <span style="color:var(--muted);font-size:13px">للعينة ${esc(s.sampleNo)}</span></div>
        <span class="badge b-pending_approval">بانتظار الموافقة — ${esc(r.reportDate)}</span>
      </div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:10px">${esc(s.farmerName||"—")} • ${esc(s.crop||s.sampleType||"")} • الفاحص: ${esc(r.createdBy||"—")}</div>
      <div style="background:#f8fafc;border-radius:10px;padding:14px;font-size:13.5px">
        <b>التشخيص:</b><p style="white-space:pre-line;margin:6px 0 12px">${esc(r.diagnosis)}</p>
        <b>التوصيات:</b><ul style="margin:6px 0;line-height:1.9">${r.recommendations.split("\n").filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="btn outline sm" onclick="openReport('${r.id}')">🖨️ معاينة</button>
        <button class="btn teal sm" onclick="approveReport('${r.id}','${r.sampleId}')">✅ موافقة واعتماد</button>
        <button class="btn danger sm" onclick="rejectModal('${r.id}','${r.sampleId}')">↩️ إعادة للمراجعة</button>
      </div>
    </div>`).join("") || '<div class="card" style="text-align:center;color:var(--muted);padding:40px">لا توجد تقارير بانتظار الموافقة</div>';
}
async function approveReport(rid, sid){
  if(!canApprove()) return toast("لا تملك صلاحية — الموافقة للمدير فقط");
  await db.collection("reports").doc(rid).update({status:"approved", approvedBy:me.name, approvedAt:today()});
  await db.collection("samples").doc(sid).update({stage:"approved"});
  await logStage(sid,"approved","وافق "+ROLES[me.role]+" على التقرير الفني");
  toast("تمت الموافقة على التقرير"); renderApprovals();
}
function rejectModal(rid, sid){
  openModal(`
    <h3>↩️ إعادة التقرير للمراجعة</h3>
    <label>التعليق / سبب الإعادة (يظهر للفاحص)</label>
    <textarea id="rejectNote" rows="3" placeholder="مثال: عدّل صياغة التوصية الثانية..."></textarea>
    <div class="modal-actions">
      <button class="btn outline sm" onclick="closeModal()">إلغاء</button>
      <button class="btn danger sm" onclick="confirmReject('${rid}','${sid}')">تأكيد الإعادة</button>
    </div>`);
}
async function confirmReject(rid, sid){
  const note = $("rejectNote").value.trim();
  await db.collection("reports").doc(rid).update({status:"rejected", reviewerNote:note});
  await db.collection("samples").doc(sid).update({stage:"completed"});
  await logStage(sid,"completed","أعاد "+ROLES[me.role]+" التقرير للمراجعة"+(note?": "+note:""));
  closeModal();
  toast("تمت إعادة التقرير للمراجعة");
  renderApprovals();
}

/* ---------- إدارة الموظفين (المسؤول فقط) ---------- */
async function renderStaff(){
  if(me.role!=="admin"){
    $("main").innerHTML = `<div class="page-head"><h1>الموظفون</h1></div>
      <div class="card" style="text-align:center;padding:50px"><div style="font-size:46px">🔒</div><h3>هذه الصفحة للمسؤول فقط</h3></div>`;
    return;
  }
  $("main").innerHTML = `<div class="page-head"><h1>إدارة الموظفين</h1></div><div id="staffBody">جارٍ التحميل...</div>`;
  const snap = await db.collection("users").get();
  const users = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||"")<(b.createdAt||"")?-1:1);
  $("staffBody").innerHTML = `
    <div class="card" style="padding:0;overflow:auto"><table class="list">
      <thead><tr><th>الاسم</th><th>البريد</th><th>الصلاحية</th><th>الحالة</th><th>إجراءات</th></tr></thead>
      <tbody>${users.map(u=>`
        <tr>
          <td><b>${esc(u.name)}</b>${u.id===me.uid?' <span class="badge b-approved">أنت</span>':""}</td>
          <td style="font-size:12px">${esc(u.email||"")}</td>
          <td>${u.id===me.uid?ROLES[u.role]:`
            <select style="padding:5px 8px;font-size:12.5px;min-width:150px" onchange="setRole('${u.id}',this.value)">
              ${["pending","user","approver","admin"].map(r=>`<option value="${r}" ${u.role===r?"selected":""}>${ROLES[r]}</option>`).join("")}
            </select>`}</td>
          <td>${u.status==="suspended"
            ?`<span class="badge b-suspended">موقوف</span>${u.suspendReason?`<div style="font-size:11px;color:#b91c1c">${esc(u.suspendReason)}</div>`:""}`
            :u.role==="pending"?'<span class="badge b-pending">بانتظار الموافقة</span>':'<span class="badge b-approved">نشط</span>'}</td>
          <td>${u.id===me.uid?"—":`
            <div style="display:flex;gap:5px;flex-wrap:wrap">
              <button class="btn outline sm" onclick="resetPass('${esc(u.email||"")}')">🔑 كلمة المرور</button>
              ${u.status==="suspended"
                ?`<button class="btn teal sm" onclick="unsuspend('${u.id}')">▶️ إلغاء الإيقاف</button>`
                :`<button class="btn outline sm" onclick="suspendModal('${u.id}','${esc(u.name)}')">⛔ إيقاف</button>`}
              <button class="btn danger sm" onclick="deleteUser('${u.id}','${esc(u.name)}')">🗑️</button>
            </div>`}</td>
        </tr>`).join("")}
      </tbody></table></div>
    <div class="alert purple">💡 تغيير الصلاحية من القائمة يُطبق فوراً. «بانتظار الموافقة» = حساب مفعّل لكنه لم يُمنح صلاحية بعد ولا يستطيع دخول النظام.</div>`;
}
async function setRole(uid, role){
  await db.collection("users").doc(uid).update({role, status:"active"});
  toast("تم تحديث الصلاحية"); renderStaff();
}
async function resetPass(email){
  if(!email) return toast("لا يوجد بريد لهذا الحساب");
  try{ await auth.sendPasswordResetEmail(email); toast("أُرسل رابط إعادة تعيين كلمة المرور إلى "+email); }
  catch(e){ toast("خطأ: "+e.message); }
}
function suspendModal(uid, name){
  openModal(`
    <h3>⛔ إيقاف حساب: ${name}</h3>
    <label>سبب الإيقاف (يظهر للموظف عند دخوله)</label>
    <textarea id="suspendReason" rows="3" placeholder="مثال: إجازة طويلة / مخالفة إدارية..."></textarea>
    <div class="modal-actions">
      <button class="btn outline sm" onclick="closeModal()">إلغاء</button>
      <button class="btn danger sm" onclick="confirmSuspend('${uid}')">تأكيد الإيقاف</button>
    </div>`);
}
async function confirmSuspend(uid){
  const reason = $("suspendReason").value.trim();
  if(!reason) return toast("اكتب سبب الإيقاف");
  await db.collection("users").doc(uid).update({status:"suspended", suspendReason:reason});
  closeModal(); toast("تم إيقاف الحساب"); renderStaff();
}
async function unsuspend(uid){
  await db.collection("users").doc(uid).update({status:"active", suspendReason:""});
  toast("تم إلغاء الإيقاف"); renderStaff();
}
function deleteUser(uid, name){
  openModal(`
    <h3>🗑️ حذف الحساب</h3>
    <p style="font-size:13.5px;color:var(--muted)">سيتم حذف حساب <b>${name}</b> من النظام نهائياً ولن يستطيع الدخول مرة أخرى.</p>
    <div class="modal-actions">
      <button class="btn outline sm" onclick="closeModal()">إلغاء</button>
      <button class="btn danger sm" onclick="confirmDelete('${uid}')">تأكيد الحذف</button>
    </div>`);
}
async function confirmDelete(uid){
  await db.collection("users").doc(uid).delete();
  closeModal(); toast("تم حذف الحساب"); renderStaff();
}

/* ---------- التقرير للطباعة ---------- */
async function openReport(rid){
  const d = await db.collection("reports").doc(rid).get();
  if(!d.exists) return toast("التقرير غير موجود");
  const r = {id:d.id,...d.data()};
  const sd = await db.collection("samples").doc(r.sampleId).get();
  const s = sd.data();
  $("appScreen").classList.add("hidden");
  const rp = $("reportPage");
  rp.classList.remove("hidden");
  rp.innerHTML = `
    <div class="report-toolbar no-print" style="padding:0 16px">
      <button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
      <button class="btn outline" onclick="closeReport('${r.sampleId}')">→ رجوع</button>
    </div>
    <div class="sheet">
      <table><tr class="head">
        <td style="width:33%">المديرية العامة<br>للبحوث الزراعية والحيوانية</td>
        <td style="width:34%;font-size:18px">تقرير فني</td>
        <td style="width:33%">مركز بحوث وقاية النبات<br><span style="font-weight:400">قسم بحوث أمراض النبات</span></td>
      </tr>
      <tr><td class="head">التاريخ: <span style="font-weight:400">${esc(r.reportDate)}</span></td>
          <td colspan="2" style="text-align:right"><b>مصدر العينة: </b>${esc(s.source)}${s.contactRef?` <span style="color:#64748b">— قيد المراسلة: ${esc(s.contactRef)}</span>`:""}</td></tr>
      <tr><td class="head">رقم التقرير: <span style="font-weight:400">${esc(r.reportNo)}</span></td>
          <td colspan="2" style="text-align:right"><b>فاحص العينة: </b>${esc(s.examinerName||"—")} &nbsp;&nbsp; <b>نوع العينة: </b>${esc(s.sampleType)}</td></tr>
      </table>

      <h2>1. التشخيص:</h2>
      <p style="white-space:pre-line;line-height:1.9">${esc(r.diagnosis)}</p>

      <table>
        <tr class="head"><td style="width:40px">م</td><td>اسم صاحب العينة</td><td>المحصول</td><td>نوع العينة</td><td>الإصابة</td></tr>
        <tr><td>1</td><td>${esc(s.farmerName||"—")}</td><td>${esc(s.crop||"—")}</td><td>${esc(s.sampleType)}</td>
            <td style="font-weight:700;color:#b91c1c">${esc(s.infection||s.result||"—")}</td></tr>
      </table>

      ${s.imageData?`<div style="margin-bottom:16px"><b>صورة العينة:</b><br><img src="${s.imageData}" style="max-height:240px;max-width:100%;border-radius:8px;border:1px solid #cbd5e1;margin-top:8px"></div>`:""}

      <h2>2. التوصيات:</h2>
      <ul>${r.recommendations.split("\n").filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>

      ${s.notes?`<h2>ملاحظات:</h2><p style="font-size:13px;color:#475569;white-space:pre-line">${esc(s.notes)}</p>`:""}

      <div class="sig">
        <div><b>فاحص العينة</b><br>${esc(s.examinerName||"................")}</div>
        <div><b>اعتماد المدير</b><br>${r.status==="approved"||r.status==="sent" ? esc(r.approvedBy||"المدير")+" — "+esc(r.approvedAt||"") : "بانتظار الاعتماد"}</div>
      </div>
    </div>`;
}
function closeReport(sid){
  $("reportPage").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  openSample(sid);
}
</script>
</body>
</html>
