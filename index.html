<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام فحص عينات النباتات</title>
<style>
:root{--green:#047857;--green-d:#065f46;--muted:#64748b;--border:#e2e8f0;--bg:#f1f5f9}
*{box-sizing:border-box;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
body{margin:0;background:var(--bg);color:#0f172a}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;width:100%;background:#fff}
textarea{resize:vertical}
label{font-size:13px;font-weight:600;display:block;margin-bottom:5px}
.hidden{display:none!important}
/* تسجيل الدخول */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:#fff;border-radius:16px;padding:36px;max-width:400px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.auth-card h1{font-size:20px;text-align:center;color:var(--green-d);margin:0 0 6px}
.auth-card p.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px}
.auth-card .field{margin-bottom:14px}
/* الهيكل */
#appScreen{display:flex;min-height:100vh}
aside{width:230px;background:#fff;border-inline-start:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
aside h2{font-size:15px;color:var(--green-d);margin:0 8px 18px;display:flex;align-items:center;gap:8px}
nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:none;background:none;border-radius:10px;font-size:14px;margin-bottom:4px;color:#334155;text-align:right}
nav button:hover{background:#f1f5f9}
nav button.active{background:#ecfdf5;color:var(--green-d);font-weight:700}
.userbox{margin-top:auto;padding:12px;border-top:1px solid var(--border);font-size:13px}
.userbox .role{color:var(--muted);font-size:12px}
main{flex:1;padding:26px;max-width:1100px;margin:0 auto;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.page-head h1{font-size:22px;margin:0}
.btn{background:var(--green);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600}
.btn:hover{background:var(--green-d)}
.btn.outline{background:#fff;color:#0f172a;border:1px solid var(--border)}
.btn.danger{background:#dc2626}
.btn.teal{background:#0f766e}
.btn:disabled{opacity:.55;cursor:not-allowed}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:18px}
.card h3{margin:0 0 14px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:900px){.grid2,.grid5{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat .n{font-size:26px;font-weight:800;margin-top:6px}
.stat .t{font-size:12px;color:var(--muted)}
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th,table.list td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--border)}
table.list th{color:var(--muted);font-size:12px;background:#f8fafc}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover{background:#f8fafc}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-received{background:#dbeafe;color:#1e40af}.b-in_progress{background:#fef3c7;color:#92400e}
.b-completed{background:#d1fae5;color:#065f46}.b-pending_approval{background:#ede9fe;color:#5b21b6}
.b-approved{background:#ccfbf1;color:#115e59}.b-sent{background:#e2e8f0;color:#334155}
.mono{font-family:Consolas,monospace;font-weight:700;color:var(--green-d)}
/* خط المراحل */
.stages{display:flex;justify-content:space-between;margin:6px 0}
.stg{flex:1;text-align:center;position:relative;font-size:11.5px}
.stg::before{content:"";display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 5px;background:#e2e8f0;border:3px solid #fff;box-shadow:0 0 0 2px #e2e8f0;z-index:1;position:relative}
.stg.done::before{background:var(--green);box-shadow:0 0 0 2px var(--green)}
.stg .d{font-size:10px;color:var(--muted)}
.stg .bar{position:absolute;top:16px;right:50%;width:100%;height:3px;background:#e2e8f0}
.stg.done .bar{background:var(--green)}
.stg:first-child .bar{display:none}
/* صورة */
.imgbox img{max-height:220px;border-radius:10px;border:1px solid var(--border)}
.img-drop{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px}
.img-drop:hover{background:#f8fafc}
/* رسم شهري */
.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar-v{background:var(--green);width:70%;border-radius:6px 6px 0 0;min-height:3px;position:relative}
.chart .bar-v span{position:absolute;top:-20px;right:50%;transform:translateX(50%);font-size:12px;font-weight:700}
.chart .lbl{font-size:10.5px;color:var(--muted);text-align:center}
/* تنبيهات */
.alert{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
.alert.purple{background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe}
.alert.red{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
#toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%);background:#0f172a;color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* سجل الحركة */
.log-item{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--border)}
.log-item .dot{width:9px;height:9px;border-radius:50%;background:var(--green);margin-top:5px;flex-shrink:0}
.log-item small{color:var(--muted);display:block}
/* التقرير للطباعة */
#reportPage{background:#f1f5f9;padding:26px 0;min-height:100vh}
.sheet{background:#fff;max-width:820px;margin:0 auto;padding:44px 48px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.sheet table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:18px}
.sheet th,.sheet td{border:1px solid #94a3b8;padding:8px 10px;text-align:center}
.sheet .head td{font-weight:700;background:#f8fafc}
.sheet h2{font-size:16px;text-decoration:underline;margin:18px 0 8px}
.sheet ul{line-height:2}
.sheet .sig{display:flex;justify-content:space-between;margin-top:50px;font-size:13px}
.report-toolbar{max-width:820px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center}
@media print{
  body{background:#fff}
  .no-print{display:none!important}
  .sheet{box-shadow:none;max-width:100%;padding:0}
}
/* شريط سفلي للجوال */
#bottomNav{display:none}
@media(max-width:700px){
  aside{display:none}
  main{padding:14px;padding-bottom:86px;max-width:100%}
  .grid2,.grid5{grid-template-columns:1fr 1fr}
  .page-head h1{font-size:19px}
  #bottomNav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:#fff;border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 12px rgba(0,0,0,.06);
  }
  #bottomNav button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;font-size:10.5px;color:var(--muted);padding:6px 2px;border-radius:10px;
  }
  #bottomNav button .ico{font-size:21px}
  #bottomNav button.active{color:var(--green-d);font-weight:700}
  #bottomNav button .b-dot{position:absolute;top:2px;left:22%;background:#7c3aed;color:#fff;font-size:10px;border-radius:99px;padding:1px 6px}
  table.list{font-size:12px;min-width:640px}
  .chart{height:150px}
}
</style>
</head>
<body>

<!-- ======== شاشة تسجيل الدخول ======== -->
<div id="authScreen">
  <div class="auth-card">
    <h1>🌱 نظام فحص عينات النباتات</h1>
    <p class="sub">قسم بحوث أمراض النبات — مركز بحوث وقاية النبات</p>
    <div class="field"><label>البريد الإلكتروني</label><input id="authEmail" type="email" placeholder="name@example.com"></div>
    <div class="field"><label>كلمة المرور</label><input id="authPass" type="password" placeholder="••••••••"></div>
    <div class="field"><label>الاسم (للتسجيل الأول فقط)</label><input id="authName" type="text" placeholder="الاسم الكامل"></div>
    <button class="btn" style="width:100%;margin-bottom:8px" onclick="doLogin()">تسجيل الدخول</button>
    <button class="btn outline" style="width:100%" onclick="doRegister()">إنشاء حساب جديد</button>
    <p class="sub" style="margin-top:14px">أول حساب يُنشأ يصبح «المسؤول» تلقائياً، والحسابات التالية «فاحص».</p>
  </div>
</div>

<!-- ======== التطبيق ======== -->
<div id="appScreen" class="hidden">
  <aside>
    <h2>🌱 <span>فحص العينات</span></h2>
    <nav>
      <button data-page="dashboard" onclick="showPage('dashboard')">📊 <span>لوحة المتابعة</span></button>
      <button data-page="samples" onclick="showPage('samples')">🧪 <span>سجل العينات</span></button>
      <button data-page="new" onclick="showPage('new')">➕ <span>تسجيل عينة</span></button>
      <button data-page="approvals" id="navApprovals" class="hidden" onclick="showPage('approvals')">✅ <span>موافقات التقارير</span> <b id="pendBadge" class="badge b-pending_approval hidden" style="margin-inline-start:auto"></b></button>
    </nav>
    <div class="userbox">
      <b id="userName"></b>
      <div class="role" id="userRole"></div>
      <button class="btn outline" style="width:100%;margin-top:10px;padding:7px" onclick="doLogout()">تسجيل الخروج</button>
    </div>
  </aside>
  <main id="main"></main>
  <!-- شريط التنقل السفلي (يظهر في الجوال فقط) -->
  <nav id="bottomNav">
    <button data-page="dashboard" onclick="showPage('dashboard')"><span class="ico">📊</span>المتابعة</button>
    <button data-page="samples" onclick="showPage('samples')"><span class="ico">🧪</span>العينات</button>
    <button data-page="new" onclick="showPage('new')"><span class="ico">➕</span>تسجيل</button>
    <button data-page="approvals" id="navApprovalsM" class="hidden" onclick="showPage('approvals')" style="position:relative"><span class="ico">✅</span>الموافقات<span id="pendBadgeM" class="b-dot hidden"></span></button>
    <button onclick="openProfile()"><span class="ico">👤</span>حسابي</button>
  </nav>
</div>

<!-- ======== صفحة التقرير (طباعة) ======== -->
<div id="reportPage" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ══════════════════════════════════════════════════════
   ⚙️ إعداد Firebase — ضع بيانات مشروعك هنا
   (من لوحة Firebase: Project settings → Your apps → Web app)
   ══════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyCiLxa2mg7JlT1Z_6OGbnnDGXAmMoPL5QI",
  authDomain: "bahla-plant-center.firebaseapp.com",
  projectId: "bahla-plant-center",
  storageBucket: "bahla-plant-center.firebasestorage.app",
  messagingSenderId: "916346827518",
  appId: "1:916346827518:web:7b45b514af5464e32aabaf"
};
/* ══════════════════════════════════════════════════════ */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const STAGES = {received:"تم الاستلام",in_progress:"قيد الفحص",completed:"اكتمل الفحص",pending_approval:"بانتظار موافقة المسؤول",approved:"تمت الموافقة",sent:"أُرسل لصاحب العينة"};
const STAGE_ORDER = ["received","in_progress","completed","pending_approval","approved","sent"];
const REPORT_STATUS = {pending:"بانتظار الموافقة",approved:"معتمد",rejected:"معاد للمراجعة",sent:"مُرسل"};
const SAMPLE_TYPES = ["تربة وجذور","جذور","تربة","أوراق","أغصان","ثمار","بذور","شتلات","عينة كاملة","أخرى"];
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

let me = null; // {uid, name, role}
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),3000);}

/* ---------- الدخول ---------- */
async function doLogin(){
  try{
    await auth.signInWithEmailAndPassword(authEmail.value.trim(), authPass.value);
  }catch(e){toast("خطأ في الدخول: "+e.message);}
}
async function doRegister(){
  try{
    const name = authName.value.trim();
    if(!name) return toast("اكتب اسمك");
    const cred = await auth.createUserWithEmailAndPassword(authEmail.value.trim(), authPass.value);
    // أول مستخدم = مسؤول
    const admins = await db.collection("users").where("role","==","admin").limit(1).get();
    const role = admins.empty ? "admin" : "user";
    await db.collection("users").doc(cred.user.uid).set({name, role, email: authEmail.value.trim(), createdAt: today()});
    toast(role==="admin" ? "تم إنشاء حسابك كمسؤول" : "تم إنشاء حسابك كفاحص");
  }catch(e){toast("خطأ: "+e.message);}
}
function doLogout(){auth.signOut();}

auth.onAuthStateChanged(async u=>{
  if(!u){
    me=null;
    document.getElementById("appScreen").classList.add("hidden");
    document.getElementById("reportPage").classList.add("hidden");
    document.getElementById("authScreen").classList.remove("hidden");
    return;
  }
  const doc = await db.collection("users").doc(u.uid).get();
  me = {uid:u.uid, ...(doc.exists?doc.data():{name:u.email,role:"user"})};
  document.getElementById("authScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");
  userName.textContent = me.name;
  userRole.textContent = me.role==="admin" ? "المسؤول" : "فاحص";
  if(me.role==="admin"){ navApprovals.classList.remove("hidden"); navApprovalsM.classList.remove("hidden"); }
  showPage("dashboard");
});

/* ---------- أدوات عامة ---------- */
async function nextNo(name, prefix){
  const ref = db.collection("counters").doc(name);
  const year = new Date().getFullYear();
  const n = await db.runTransaction(async t=>{
    const d = await t.get(ref);
    const v = (d.exists? d.data().value:0)+1;
    t.set(ref,{value:v});
    return v;
  });
  return `${prefix}-${year}-${String(n).padStart(4,"0")}`;
}
async function logStage(sampleId, stage, note){
  await db.collection("samples").doc(sampleId).collection("logs").add({
    stage, note: note||"", by: me.name, at: firebase.firestore.FieldValue.serverTimestamp()
  });
}
function fileToDataUrl(file, maxSize=900, quality=0.7){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>{const img=new Image();img.onload=()=>{
      let w=img.width,h=img.height;const sc=Math.min(1,maxSize/Math.max(w,h));
      const c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",quality));
    };img.onerror=rej;img.src=r.result;};
    r.onerror=rej;r.readAsDataURL(file);
  });
}
function fmtDate(ts){ if(!ts) return ""; const d = ts.toDate? ts.toDate(): new Date(ts); return d.toLocaleDateString("ar"); }

/* ---------- التنقل ---------- */
function showPage(p){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active", b.dataset.page===p));
  if(p==="dashboard") renderDashboard();
  if(p==="samples") renderSamples();
  if(p==="new") renderNew();
  if(p==="approvals") renderApprovals();
}
</script>
<script>
/* ---------- لوحة المتابعة ---------- */
async function renderDashboard(){
  const main = document.getElementById("main");
  main.innerHTML = `<div class="page-head"><h1>لوحة المتابعة</h1></div><div id="dashBody">جارٍ التحميل...</div>`;
  const snap = await db.collection("samples").get();
  const samples = snap.docs.map(d=>({id:d.id,...d.data()}));
  const byStage = {}; STAGE_ORDER.forEach(s=>byStage[s]=0);
  samples.forEach(s=>byStage[s.stage]=(byStage[s.stage]||0)+1);
  // شهري
  const monthly = {};
  samples.forEach(s=>{ const m=(s.receivedAt||"").slice(0,7); if(m) monthly[m]=(monthly[m]||0)+1; });
  const months = Object.keys(monthly).sort().slice(-12);
  const maxM = Math.max(1,...months.map(m=>monthly[m]));
  // بانتظار الموافقة
  const pend = await db.collection("reports").where("status","==","pending").get();
  pendBadge.textContent = pend.size;
  pendBadge.classList.toggle("hidden", pend.size===0);
  pendBadgeM.textContent = pend.size;
  pendBadgeM.classList.toggle("hidden", pend.size===0);

  document.getElementById("dashBody").innerHTML = `
    ${me.role==="admin"&&pend.size>0?`<div class="alert purple">📋 لديك <b>${pend.size}</b> تقرير بانتظار موافقتك — <a href="#" onclick="showPage('approvals');return false" style="color:#5b21b6;font-weight:700">مراجعتها الآن</a></div>`:""}
    <div class="grid5" style="margin-bottom:18px">
      <div class="stat"><div class="t">📥 إجمالي العينات</div><div class="n">${samples.length}</div></div>
      <div class="stat"><div class="t">🧪 قيد الاستلام/الفحص</div><div class="n">${byStage.received+byStage.in_progress}</div></div>
      <div class="stat"><div class="t">⏳ بانتظار الموافقة</div><div class="n">${byStage.pending_approval}</div></div>
      <div class="stat"><div class="t">✅ تقارير معتمدة</div><div class="n">${byStage.approved}</div></div>
      <div class="stat"><div class="t">📤 أُرسلت لأصحابها</div><div class="n">${byStage.sent}</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>العينات حسب الشهر</h3>
        <div class="chart">${months.map(m=>{
          const [y,mo]=m.split("-");
          return `<div class="col"><div class="bar-v" style="height:${Math.round(monthly[m]/maxM*100)}%"><span>${monthly[m]}</span></div><div class="lbl">${MONTHS[+mo-1]}<br>${y}</div></div>`;
        }).join("")||'<p style="color:var(--muted)">لا توجد بيانات بعد</p>'}</div>
      </div>
      <div class="card"><h3>مراحل العينات</h3>
        ${STAGE_ORDER.map(s=>{const c=byStage[s];const pct=samples.length?Math.round(c/samples.length*100):0;
          return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
          <span class="badge b-${s}">${STAGES[s]}</span><b>${c}</b></div>
          <div style="height:8px;background:#f1f5f9;border-radius:99px"><div style="height:100%;width:${pct}%;background:var(--green);border-radius:99px"></div></div></div>`;}).join("")}
      </div>
    </div>
    <div class="card"><h3>أحدث العينات</h3>
      ${samples.sort((a,b)=>(b.createdAtSec||0)-(a.createdAtSec||0)).slice(0,6).map(s=>`
        <div class="log-item" style="cursor:pointer;align-items:center" onclick="openSample('${s.id}')">
          <span class="mono">${esc(s.sampleNo)}</span>
          <span>${esc(s.farmerName||s.source)}</span>
          <span style="color:var(--muted);font-size:12px">${esc(s.crop||s.sampleType)}</span>
          <span style="margin-inline-start:auto" class="badge b-${s.stage}">${STAGES[s.stage]}</span>
        </div>`).join("")||'<p style="color:var(--muted);text-align:center;padding:20px">لا توجد عينات بعد — ابدأ بتسجيل أول عينة</p>'}
    </div>`;
}

/* ---------- سجل العينات ---------- */
async function renderSamples(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="page-head"><h1>سجل العينات</h1>
      <button class="btn" onclick="showPage('new')">➕ تسجيل عينة جديدة</button></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <input id="q" placeholder="بحث برقم العينة / المزارع / المصدر..." style="max-width:320px" oninput="loadSamples()">
      <select id="fstage" style="max-width:200px" onchange="loadSamples()">
        <option value="">كل المراحل</option>
        ${STAGE_ORDER.map(s=>`<option value="${s}">${STAGES[s]}</option>`).join("")}
      </select>
    </div>
    <div class="card" style="padding:0;overflow:auto"><table class="list">
      <thead><tr><th>رقم العينة</th><th>تاريخ الوصول</th><th>صاحب العينة / المصدر</th><th>النوع</th><th>المحصول</th><th>قيد المراسلة</th><th>المرحلة</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" style="text-align:center;padding:30px">جارٍ التحميل...</td></tr></tbody>
    </table></div>`;
  loadSamples();
}
async function loadSamples(){
  const q = (document.getElementById("q").value||"").trim();
  const st = document.getElementById("fstage").value;
  const snap = await db.collection("samples").get();
  let rows = snap.docs.map(d=>({id:d.id,...d.data()}));
  if(st) rows = rows.filter(r=>r.stage===st);
  if(q) rows = rows.filter(r=>(r.sampleNo||"").includes(q)||(r.farmerName||"").includes(q)||(r.source||"").includes(q));
  rows.sort((a,b)=>(b.createdAtSec||0)-(a.createdAtSec||0));
  document.getElementById("rows").innerHTML = rows.map(s=>`
    <tr onclick="openSample('${s.id}')">
      <td class="mono">${esc(s.sampleNo)}</td><td>${esc(s.receivedAt)}</td>
      <td>${esc(s.farmerName||s.source)}</td><td>${esc(s.sampleType)}</td>
      <td>${esc(s.crop||"—")}</td><td>${esc(s.contactRef||"—")}</td>
      <td><span class="badge b-${s.stage}">${STAGES[s.stage]}</span></td>
    </tr>`).join("") || '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">لا توجد عينات مطابقة</td></tr>';
}

/* ---------- تسجيل عينة ---------- */
let newImg = null;
function renderNew(){
  newImg = null;
  document.getElementById("main").innerHTML = `
    <div class="page-head"><h1>تسجيل عينة جديدة</h1></div>
    <div class="card" style="max-width:760px"><h3>بيانات استلام العينة</h3>
      <div class="grid2">
        <div><label>تاريخ وصول العينة *</label><input type="date" id="f_received" value="${today()}"></div>
        <div><label>رقم التواصل / قيد المراسلة</label><input id="f_ref" placeholder="مثال: 1234/2025"></div>
        <div><label>اسم صاحب العينة (المزارع)</label><input id="f_farmer"></div>
        <div><label>مصدر العينة *</label><input id="f_source" placeholder="مثال: عينة مسحوبة من قبل المزارع"></div>
        <div><label>نوع العينة *</label><select id="f_type"><option value="">اختر...</option>${SAMPLE_TYPES.map(t=>`<option>${t}</option>`).join("")}</select></div>
        <div><label>المحصول</label><input id="f_crop" placeholder="عنب، نخيل، ليمون..."></div>
      </div>
      <div style="margin-top:14px"><label>ملاحظات</label><textarea id="f_notes" rows="2"></textarea></div>
      <div style="margin-top:14px"><label>صورة العينة</label>
        <div id="imgArea"><label class="img-drop">📷 اضغط لإرفاق صورة من العينة<input type="file" accept="image/*" class="hidden" onchange="pickImg(this,'new')"></label></div>
      </div>
      <button class="btn" style="width:100%;margin-top:18px" onclick="saveSample(this)">تسجيل العينة</button>
    </div>`;
}
async function pickImg(inp, mode){
  const f = inp.files[0]; if(!f) return;
  const data = await fileToDataUrl(f);
  if(mode==="new"){ newImg = data;
    document.getElementById("imgArea").innerHTML = `<div class="imgbox"><img src="${data}"></div>`;
  } else {
    await db.collection("samples").doc(mode).update({imageData:data});
    toast("تم حفظ الصورة"); openSample(mode);
  }
}
async function saveSample(btn){
  const source=f_source.value.trim(), type=f_type.value, received=f_received.value;
  if(!source||!type||!received) return toast("أكمل الحقول المطلوبة (*)");
  btn.disabled=true;
  const sampleNo = await nextNo("sample","ع");
  const ref = await db.collection("samples").add({
    sampleNo, receivedAt:received, source, contactRef:f_ref.value.trim()||"",
    sampleType:type, crop:f_crop.value.trim()||"", farmerName:f_farmer.value.trim()||"",
    notes:f_notes.value.trim()||"", imageData:newImg||"",
    stage:"received", createdBy:me.name, createdAtSec:Date.now()
  });
  await logStage(ref.id,"received","تم استلام العينة وتسجيلها");
  toast(`تم تسجيل العينة برقم ${sampleNo}`);
  openSample(ref.id);
}
</script>
<script>
/* ---------- صفحة العينة ---------- */
async function openSample(id){
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  const main = document.getElementById("main");
  main.innerHTML = "جارٍ التحميل...";
  const d = await db.collection("samples").doc(id).get();
  if(!d.exists){toast("العينة غير موجودة");return showPage("samples");}
  const s = {id:d.id,...d.data()};
  const logsSnap = await db.collection("samples").doc(id).collection("logs").get();
  const logs = logsSnap.docs.map(x=>x.data()).sort((a,b)=>(a.at?.seconds||0)-(b.at?.seconds||0));
  const reps = await db.collection("reports").where("sampleId","==",id).get();
  const report = reps.empty?null:{id:reps.docs[0].id,...reps.docs[0].data()};
  const cur = STAGE_ORDER.indexOf(s.stage);
  const editable = !report || ["pending","rejected"].includes(report.status);

  main.innerHTML = `
    <div class="page-head">
      <div style="display:flex;align-items:center;gap:10px">
        <h1 class="mono">${esc(s.sampleNo)}</h1>
        <span class="badge b-${s.stage}">${STAGES[s.stage]}</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${report?`<button class="btn outline" onclick="openReport('${report.id}')">🖨️ عرض / طباعة التقرير</button>`:""}
        ${report&&report.status==="approved"?`<button class="btn teal" onclick="markSent('${report.id}','${id}')">📤 تم الإرسال لصاحب العينة</button>`:""}
      </div>
    </div>

    <div class="card"><h3>مراحل العينة</h3>
      <div class="stages">${STAGE_ORDER.map((st,i)=>{
        const lg=[...logs].reverse().find(l=>l.stage===st);
        return `<div class="stg ${i<=cur?"done":""}"><div class="bar"></div>${STAGES[st]}${lg?`<div class="d">${fmtDate(lg.at)}</div>`:""}</div>`;
      }).join("")}</div>
    </div>

    <div class="grid2">
      <div class="card"><h3>بيانات الاستلام</h3>
        <table style="font-size:13.5px;width:100%">
          <tr><td style="color:var(--muted);padding:5px 0">تاريخ الوصول</td><td><b>${esc(s.receivedAt)}</b></td></tr>
          <tr><td style="color:var(--muted);padding:5px 0">مصدر العينة</td><td><b>${esc(s.source)}</b></td></tr>
          <tr><td style="color:var(--muted);padding:5px 0">قيد المراسلة</td><td><b>${esc(s.contactRef||"—")}</b></td></tr>
          <tr><td style="color:var(--muted);padding:5px 0">نوع العينة</td><td><b>${esc(s.sampleType)}</b></td></tr>
          <tr><td style="color:var(--muted);padding:5px 0">المحصول</td><td><b>${esc(s.crop||"—")}</b></td></tr>
          <tr><td style="color:var(--muted);padding:5px 0">صاحب العينة</td><td><b>${esc(s.farmerName||"—")}</b></td></tr>
        </table>
        <div style="margin-top:12px"><label>صورة العينة</label>
          ${s.imageData?`<div class="imgbox"><img src="${s.imageData}"></div>`
            :`<label class="img-drop">📷 إرفاق صورة<input type="file" accept="image/*" class="hidden" onchange="pickImg(this,'${id}')"></label>`}
        </div>
      </div>

      <div class="card"><h3>بيانات الفحص والنتيجة</h3>
        <div class="grid2">
          <div><label>تاريخ بدء الفحص</label><input type="date" id="e_start" value="${esc(s.examStartedAt||"")}"></div>
          <div><label>فاحص العينة</label><input id="e_examiner" value="${esc(s.examinerName||"")}"></div>
        </div>
        <div style="margin-top:12px"><label>الإصابة / الآفة المشخّصة</label><input id="e_infection" value="${esc(s.infection||"")}" placeholder="مثال: نيماتودا تعقد الجذور — بدون إصابة"></div>
        <div style="margin-top:12px"><label>النتيجة</label><textarea id="e_result" rows="3">${esc(s.result||"")}</textarea></div>
        <div style="margin-top:12px"><label>ملاحظات</label><textarea id="e_notes" rows="2">${esc(s.notes||"")}</textarea></div>
        <button class="btn outline" style="width:100%;margin-top:14px" onclick="saveExam('${id}')">حفظ بيانات الفحص</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">📄 التقرير الفني</h3>
        ${report?`<span class="badge ${report.status==="approved"?"b-approved":report.status==="rejected"?"b-received":"b-pending_approval"}">${REPORT_STATUS[report.status]} — ${esc(report.reportNo)}</span>`:""}
      </div>
      ${report&&report.status==="rejected"&&report.reviewerNote?`<div class="alert red">ملاحظة المسؤول: ${esc(report.reviewerNote)}</div>`:""}
      <div><label>التشخيص</label><textarea id="r_diag" rows="4" ${editable?"":"disabled"} placeholder="بعد فحص عينات الجذور والتربة أظهرت النتائج ما يلي...">${esc(report?report.diagnosis:(s.result||""))}</textarea></div>
      <div style="margin-top:12px"><label>التوصيات (سطر لكل توصية)</label><textarea id="r_rec" rows="5" ${editable?"":"disabled"} placeholder="التخلص من عقل العنب في حالة الإصابة الشديدة.&#10;معاملة التربة بالتعقيم الحراري إن أمكن...">${esc(report?report.recommendations:"")}</textarea></div>
      ${editable?`<button class="btn" style="margin-top:14px" onclick="saveReport('${id}','${report?report.id:""}')">📨 ${report&&report.status==="rejected"?"إعادة إرسال لموافقة المسؤول":"إرسال لموافقة المسؤول"}</button>`:""}
      ${report&&report.status==="pending"?`<div class="alert purple" style="margin-top:12px">التقرير بانتظار موافقة المسؤول — لا يمكن إرساله رسمياً لصاحب العينة قبل الاعتماد.</div>`:""}
    </div>

    <div class="card"><h3>سجل الحركة</h3>
      ${[...logs].reverse().map(l=>`<div class="log-item"><div class="dot"></div><div>
        <b>${STAGES[l.stage]||l.stage}</b> ${l.note?`<span style="color:var(--muted)">— ${esc(l.note)}</span>`:""}
        <small>${l.at?new Date(l.at.seconds*1000).toLocaleString("ar"):""} ${l.by?"• "+esc(l.by):""}</small></div></div>`).join("")}
    </div>`;
}

async function saveExam(id){
  const patch = {
    examStartedAt: e_start.value, examinerName: e_examiner.value.trim(),
    infection: e_infection.value.trim(), result: e_result.value.trim(), notes: e_notes.value.trim()
  };
  const d = await db.collection("samples").doc(id).get();
  const cur = d.data().stage;
  if(patch.examStartedAt && cur==="received"){ patch.stage="in_progress"; }
  if(patch.result && ["received","in_progress"].includes(cur)){ patch.stage="completed"; }
  await db.collection("samples").doc(id).update(patch);
  if(patch.stage==="in_progress") await logStage(id,"in_progress","بدأ الفحص المخبري");
  if(patch.stage==="completed") await logStage(id,"completed","اكتمل الفحص وتم تسجيل النتيجة");
  toast("تم حفظ بيانات الفحص"); openSample(id);
}

async function saveReport(sampleId, reportId){
  const diagnosis=r_diag.value.trim(), recommendations=r_rec.value.trim();
  if(!diagnosis||!recommendations) return toast("أكمل التشخيص والتوصيات");
  const data = {sampleId, diagnosis, recommendations, status:"pending", reviewerNote:"", reportDate:today(), createdBy:me.name};
  if(reportId){
    await db.collection("reports").doc(reportId).update(data);
  } else {
    data.reportNo = await nextNo("report","ت");
    const ref = await db.collection("reports").add(data);
    reportId = ref.id;
  }
  await db.collection("samples").doc(sampleId).update({stage:"pending_approval"});
  await logStage(sampleId,"pending_approval","تم إرسال التقرير الفني لموافقة المسؤول");
  toast("تم إرسال التقرير لموافقة المسؤول"); openSample(sampleId);
}

async function markSent(reportId, sampleId){
  await db.collection("reports").doc(reportId).update({status:"sent"});
  await db.collection("samples").doc(sampleId).update({stage:"sent"});
  await logStage(sampleId,"sent","تم تسليم/إرسال التقرير لصاحب العينة");
  toast("تم التعليم كمُرسل"); openSample(sampleId);
}
</script>
<script>
/* ---------- موافقات المسؤول ---------- */
async function renderApprovals(){
  const main = document.getElementById("main");
  main.innerHTML = `<div class="page-head"><h1>التقارير بانتظار الموافقة</h1></div>
    <p style="color:var(--muted);font-size:13px">راجع التقرير الفني قبل اعتماده — لا يُرسل رسمياً لصاحب العينة إلا بعد موافقتك.</p>
    <div id="apprBody">جارٍ التحميل...</div>`;
  const snap = await db.collection("reports").where("status","==","pending").get();
  const items = [];
  for(const d of snap.docs){
    const r = {id:d.id,...d.data()};
    const sd = await db.collection("samples").doc(r.sampleId).get();
    items.push({r, s: sd.exists?sd.data():{}});
  }
  document.getElementById("apprBody").innerHTML = items.map(({r,s})=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <div><span class="mono">${esc(r.reportNo)}</span> <span style="color:var(--muted);font-size:13px">للعينة ${esc(s.sampleNo)}</span></div>
        <span class="badge b-pending_approval">بانتظار الموافقة — ${esc(r.reportDate)}</span>
      </div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:10px">${esc(s.farmerName||"—")} • ${esc(s.crop||s.sampleType||"")}</div>
      <div style="background:#f8fafc;border-radius:10px;padding:14px;font-size:13.5px">
        <b>التشخيص:</b><p style="white-space:pre-line;margin:6px 0 12px">${esc(r.diagnosis)}</p>
        <b>التوصيات:</b><ul style="margin:6px 0;line-height:1.9">${r.recommendations.split("\n").filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="btn outline" onclick="openReport('${r.id}')">🖨️ معاينة التقرير</button>
        <button class="btn teal" onclick="approveReport('${r.id}','${r.sampleId}')">✅ موافقة واعتماد</button>
        <button class="btn danger" onclick="rejectReport('${r.id}','${r.sampleId}')">↩️ إعادة للمراجعة</button>
      </div>
    </div>`).join("") || '<div class="card" style="text-align:center;color:var(--muted);padding:40px">لا توجد تقارير بانتظار الموافقة</div>';
}
async function approveReport(rid, sid){
  await db.collection("reports").doc(rid).update({status:"approved", approvedBy:me.name, approvedAt:today()});
  await db.collection("samples").doc(sid).update({stage:"approved"});
  await logStage(sid,"approved","وافق المسؤول على التقرير الفني");
  toast("تمت الموافقة على التقرير"); renderApprovals();
}
async function rejectReport(rid, sid){
  const note = prompt("سبب الإعادة / ملاحظات للفاحص (اختياري):") || "";
  await db.collection("reports").doc(rid).update({status:"rejected", reviewerNote:note});
  await db.collection("samples").doc(sid).update({stage:"completed"});
  await logStage(sid,"completed","أعاد المسؤول التقرير للمراجعة"+(note?": "+note:""));
  toast("تمت إعادة التقرير للمراجعة"); renderApprovals();
}

/* ---------- التقرير للطباعة ---------- */
async function openReport(rid){
  const d = await db.collection("reports").doc(rid).get();
  if(!d.exists) return toast("التقرير غير موجود");
  const r = {id:d.id,...d.data()};
  const sd = await db.collection("samples").doc(r.sampleId).get();
  const s = sd.data();
  document.getElementById("appScreen").classList.add("hidden");
  const rp = document.getElementById("reportPage");
  rp.classList.remove("hidden");
  rp.innerHTML = `
    <div class="report-toolbar no-print" style="padding:0 16px">
      <button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
      <button class="btn outline" onclick="closeReport('${r.sampleId}')">→ رجوع للعينة</button>
    </div>
    <div class="sheet">
      <table><tr class="head">
        <td style="width:33%">المديرية العامة<br>للبحوث الزراعية والحيوانية</td>
        <td style="width:34%;font-size:18px">تقرير فني</td>
        <td style="width:33%">مركز بحوث وقاية النبات<br><span style="font-weight:400">قسم بحوث أمراض النبات</span></td>
      </tr>
      <tr><td class="head">التاريخ: <span style="font-weight:400">${esc(r.reportDate)}</span></td>
          <td colspan="2" style="text-align:right"><b>مصدر العينة: </b>${esc(s.source)}${s.contactRef?` <span style="color:#64748b">— قيد المراسلة: ${esc(s.contactRef)}</span>`:""}</td></tr>
      <tr><td class="head">رقم التقرير: <span style="font-weight:400">${esc(r.reportNo)}</span></td>
          <td colspan="2" style="text-align:right"><b>فاحص العينة: </b>${esc(s.examinerName||"—")} &nbsp;&nbsp; <b>نوع العينة: </b>${esc(s.sampleType)}</td></tr>
      </table>

      <h2>1. التشخيص:</h2>
      <p style="white-space:pre-line;line-height:1.9">${esc(r.diagnosis)}</p>

      <table>
        <tr class="head"><td style="width:40px">م</td><td>اسم صاحب العينة</td><td>المحصول</td><td>نوع العينة</td><td>الإصابة</td></tr>
        <tr><td>1</td><td>${esc(s.farmerName||"—")}</td><td>${esc(s.crop||"—")}</td><td>${esc(s.sampleType)}</td>
            <td style="font-weight:700;color:#b91c1c">${esc(s.infection||s.result||"—")}</td></tr>
      </table>

      ${s.imageData?`<div style="margin-bottom:16px"><b>صورة العينة:</b><br><img src="${s.imageData}" style="max-height:240px;border-radius:8px;border:1px solid #cbd5e1;margin-top:8px"></div>`:""}

      <h2>2. التوصيات:</h2>
      <ul>${r.recommendations.split("\n").filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>

      ${s.notes?`<h2>ملاحظات:</h2><p style="font-size:13px;color:#475569;white-space:pre-line">${esc(s.notes)}</p>`:""}

      <div class="sig">
        <div><b>فاحص العينة</b><br>${esc(s.examinerName||"................")}</div>
        <div><b>اعتماد المسؤول</b><br>${r.status==="approved"||r.status==="sent" ? esc(r.approvedBy||"المسؤول")+" — "+esc(r.approvedAt||"") : "بانتظار الاعتماد"}</div>
      </div>
    </div>`;
}
function closeReport(sid){
  document.getElementById("reportPage").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");
  openSample(sid);
}
</script>
</body>
